// Set 3: Multi-step employment-status changes
{ id:4006, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"The Comptroller begins with a classification trap: a worker with a part-time paid job wants full-time work. How is that worker classified in the headline unemployment rate?", options:["Employed","Unemployed","Not in the labor force","Discouraged"], a:0, tag:"employment_categories", type:"trap", objective:"LO29.2", boss:"FinalBoss", feedback:"Any paid work generally means the person is counted as employed, even if underemployed." },
{ id:4007, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"Why can involuntary part-time work make the unemployment rate look better than the labor market feels?", options:["Part-time workers are counted as employed even if they want more hours","Part-time workers are counted as unemployed twice","Part-time work is excluded from the labor force","Part-time workers are counted as discouraged"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", boss:"FinalBoss", feedback:"The headline unemployment rate does not fully capture underemployment." },
{ id:4008, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"An economy has 120 employed, 12 unemployed, and 68 not in the labor force. Four unemployed workers find jobs, and four employed workers move to part-time work but keep paid jobs. What is the new unemployment rate?", options:["6.1%","9.1%","8.0%","12.0%"], a:0, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", boss:"FinalBoss", feedback:"New employed = 124, unemployed = 8, labor force = 132. Unemployment = 8/132 = 6.1%. Part-time workers remain employed." },

// Set 4: Frictional unemployment
{ id:4009, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"The Comptroller asks about job search: frictional unemployment is mainly caused by:", options:["The time required for workers and firms to find good matches","A permanent mismatch between skills and jobs","A recession reducing total spending","A binding minimum wage only"], a:0, tag:"unemployment_types", type:"definition", objective:"LO29.3", boss:"FinalBoss", feedback:"Frictional unemployment comes from normal job search and matching." },
{ id:4010, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A software developer quits one job and spends three weeks comparing offers from similar firms. What type of unemployment is this?", options:["Frictional","Structural","Cyclical","Discouraged"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", boss:"FinalBoss", feedback:"Short-term search between suitable jobs is frictional unemployment." },
{ id:4011, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"A new job-matching platform helps workers find suitable openings faster. Which unemployment type should fall most directly?", options:["Frictional unemployment","Structural unemployment","Cyclical unemployment","Natural resources unemployment"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", boss:"FinalBoss", feedback:"Better matching reduces search time, which lowers frictional unemployment." },

// Set 5: Structural unemployment
{ id:4012, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"The Comptroller turns to mismatch: structural unemployment occurs when:", options:["Worker skills or locations do not match available jobs","Workers briefly search between similar jobs","A recession temporarily reduces spending","A worker takes paid part-time work"], a:0, tag:"unemployment_types", type:"definition", objective:"LO29.3", boss:"FinalBoss", feedback:"Structural unemployment reflects a mismatch between workers and available jobs." },
{ id:4013, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A factory permanently closes because production technology changes, and former workers lack the skills needed in growing industries. What type of unemployment is this?", options:["Structural","Frictional","Cyclical","Seasonal only"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", boss:"FinalBoss", feedback:"Permanent industry change and skill mismatch create structural unemployment." },
{ id:4014, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"Which policy best targets structural unemployment?", options:["Retraining workers for expanding industries","Extending vacations","Changing the CPI base year","Counting imports differently"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", boss:"FinalBoss", feedback:"Retraining can reduce mismatch between worker skills and available jobs." },

// Set 6: Cyclical unemployment
{ id:4015, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"cyclical_unemployment", secondarySkills:["natural_rate"], repairSkill:"cyclical_unemployment", commonError:"Confusing recession-driven unemployment with natural unemployment.", q:"The Comptroller points to the business cycle: cyclical unemployment is unemployment caused by:", options:["Downturns in the business cycle and weak aggregate demand","Normal job search","A permanent skills mismatch only","Workers retiring voluntarily"], a:0, tag:"unemployment_types", type:"definition", objective:"LO29.3", boss:"FinalBoss", feedback:"Cyclical unemployment rises during recessions or weak economic periods." },
{ id:4016, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"cyclical_unemployment", secondarySkills:["natural_rate"], repairSkill:"cyclical_unemployment", commonError:"Confusing recession-driven unemployment with natural unemployment.", q:"A hotel lays off workers because a recession reduces travel demand. What type of unemployment is this?", options:["Cyclical","Frictional","Structural","Not in the labor force"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", boss:"FinalBoss", feedback:"Layoffs from weak demand during a recession are cyclical unemployment." },
{ id:4017, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"Actual unemployment is 8% and the natural rate is 5%. What is cyclical unemployment?", options:["3 percentage points","5 percentage points","8 percentage points","13 percentage points"], a:0, tag:"natural_unemployment", type:"calculation", objective:"LO29.5", boss:"FinalBoss", feedback:"Cyclical unemployment = actual unemployment - natural unemployment = 8 - 5 = 3 percentage points." },

// Set 7: Mixed unemployment classification
{ id:4018, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"The Comptroller presents three workers: a nurse moves cities and searches for a new hospital job. A cashier loses work because checkout automation permanently reduces demand. A waiter is laid off during a recession. What is the correct order?", options:["Frictional, structural, cyclical","Structural, frictional, cyclical","Cyclical, structural, frictional","Frictional, cyclical, structural"], a:0, tag:"unemployment_types", type:"multi-step", objective:"LO29.3", boss:"FinalBoss", feedback:"Search is frictional, permanent automation mismatch is structural, and recession layoff is cyclical." },
{ id:4019, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A worker first loses a job because of a recession, then the industry permanently changes and the old job does not return. What is the best classification over time?", options:["Initially cyclical, then possibly structural","Always frictional","Always not in the labor force","Never unemployed"], a:0, tag:"unemployment_types", type:"integration", objective:"LO29.3", boss:"FinalBoss", feedback:"The cause can shift from weak demand to long-term mismatch." },
{ id:4020, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"cyclical_unemployment", secondarySkills:["natural_rate"], repairSkill:"cyclical_unemployment", commonError:"Confusing recession-driven unemployment with natural unemployment.", q:"Which unemployment type is most directly reduced by economic recovery from recession?", options:["Cyclical unemployment","Structural unemployment","Frictional unemployment","Natural unemployment"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", boss:"FinalBoss", feedback:"Recovery mainly reduces recession-driven cyclical unemployment." },

// Set 8: Unemployment insurance tradeoffs
{ id:4021, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"The Comptroller asks about worker protection: unemployment insurance is designed mainly to:", options:["Protect workers' income while they search for jobs","Eliminate all unemployment","Raise CPI inflation","Count discouraged workers as employed"], a:0, tag:"labor_market_policy", type:"definition", objective:"LO29.4", boss:"FinalBoss", feedback:"Unemployment insurance gives income support to workers who lose jobs." },
{ id:4022, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"Why can unemployment insurance increase frictional unemployment?", options:["It can reduce the urgency to accept a job quickly and lengthen search","It permanently destroys worker skills","It directly causes recessions","It counts retirees as unemployed"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", boss:"FinalBoss", feedback:"Benefits can make longer job search less costly, increasing frictional unemployment." },
{ id:4023, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"A state increases unemployment benefits but also improves job-placement services. What is the most careful prediction?", options:["The net effect on frictional unemployment is ambiguous because benefits may lengthen search while matching services may shorten it","Frictional unemployment must rise","Frictional unemployment must fall","Only structural unemployment can change"], a:0, tag:"labor_market_policy", type:"integration", objective:"LO29.4", boss:"FinalBoss", feedback:"Two forces move in opposite directions, so the net effect is not automatic." },

// Set 9: Minimum wage and labor surplus
{ id:4024, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"minimum_wage_surplus", secondarySkills:["unions_efficiency_wages"], repairSkill:"minimum_wage_surplus", commonError:"Forgetting that a binding wage floor creates a surplus when labor supplied exceeds labor demanded.", q:"The Comptroller sets a wage floor: a binding minimum wage is a wage set:", options:["Above the equilibrium wage","Below the equilibrium wage","Equal to the CPI","Below zero"], a:0, tag:"labor_market_policy", type:"definition", objective:"LO29.4", boss:"FinalBoss", feedback:"A binding minimum wage is above equilibrium and prevents the wage from falling to market-clearing level." },
{ id:4025, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"minimum_wage_surplus", secondarySkills:["unions_efficiency_wages"], repairSkill:"minimum_wage_surplus", commonError:"Forgetting that a binding wage floor creates a surplus when labor supplied exceeds labor demanded.", q:"At a minimum wage of $15, 140 workers want jobs and firms demand 100 workers. What is the labor surplus?", options:["40 workers","100 workers","140 workers","240 workers"], a:0, tag:"labor_market_policy", type:"calculation", objective:"LO29.4", boss:"FinalBoss", feedback:"Labor surplus = quantity supplied - quantity demanded = 140 - 100 = 40 workers." },
{ id:4026, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"minimum_wage_surplus", secondarySkills:["unions_efficiency_wages"], repairSkill:"minimum_wage_surplus", commonError:"Forgetting that a binding wage floor creates a surplus when labor supplied exceeds labor demanded.", q:"What is the key tradeoff of a binding minimum wage?", options:["Some workers earn more, but others may lose jobs or fail to find work","All workers are guaranteed jobs","Firms hire more workers at higher wages","Unemployment must fall to zero"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", boss:"FinalBoss", feedback:"A binding wage floor can raise wages for some while reducing employment opportunities for others." },

// Set 10: Unions and insider-outsider effects
{ id:4027, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"The Comptroller examines bargaining power: unions can contribute to unemployment when they:", options:["Push wages above equilibrium in unionized labor markets","Lower wages below equilibrium","Make all labor markets perfectly competitive","Eliminate bargaining"], a:0, tag:"labor_market_policy", type:"definition", objective:"LO29.4", boss:"FinalBoss", feedback:"Union wage bargaining can raise wages above equilibrium and reduce labor demanded." },
{ id:4028, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"A union contract raises wages for current workers, but firms reduce hiring. Who may be hurt?", options:["Workers who would have been hired at the lower wage but are now priced out","All workers who keep their jobs","Only retired workers","Only foreign consumers"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", boss:"FinalBoss", feedback:"The insider-outsider issue is that current workers may benefit while job seekers lose opportunities." },
{ id:4029, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"A union wage creates labor supply of 500 and labor demand of 420. What does the gap represent?", options:["80 workers who want jobs at that wage but are not hired","420 unemployed workers","500 employed workers","920 total unemployed workers"], a:0, tag:"labor_market_policy", type:"calculation", objective:"LO29.4", boss:"FinalBoss", feedback:"The labor surplus is 500 - 420 = 80 workers." },

// Set 11: Efficiency wages
{ id:4030, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"The Comptroller raises the wage ledger: efficiency wage theory says firms may pay above-equilibrium wages because:", options:["Higher wages can improve effort, reduce turnover, attract better workers, or improve morale","Higher wages always reduce productivity","Firms are legally required to overpay all workers","Above-equilibrium wages eliminate unemployment"], a:0, tag:"labor_market_policy", type:"definition", objective:"LO29.4", boss:"FinalBoss", feedback:"Efficiency wages can be profitable if they improve worker productivity or reduce costly turnover." },
{ id:4031, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"A firm pays higher wages and finds workers quit less often and work harder. Which theory explains this?", options:["Efficiency wage theory","CPI bias","Net export theory","GDP deflator theory"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", boss:"FinalBoss", feedback:"Efficiency wages can reduce turnover and increase effort." },
{ id:4032, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"Why can efficiency wages contribute to unemployment?", options:["If wages stay above equilibrium, more workers may want jobs than firms are willing to hire","Efficiency wages make workers leave the labor force","Efficiency wages force all firms to hire more workers","Efficiency wages eliminate structural mismatch"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", boss:"FinalBoss", feedback:"Above-equilibrium wages can create a labor surplus even if firms have a reason to pay them." },

// Set 12: Natural rate of unemployment
{ id:4033, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"The Comptroller asks for the normal baseline: the natural rate of unemployment includes mainly:", options:["Frictional and structural unemployment","Only cyclical unemployment","Only discouraged workers","Only retired workers"], a:0, tag:"natural_unemployment", type:"definition", objective:"LO29.5", boss:"FinalBoss", feedback:"The natural rate includes unemployment from normal search and structural mismatch." },
{ id:4034, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"Why does unemployment remain positive even in a healthy economy?", options:["Workers are still searching for jobs and some skills or locations do not match available jobs","Every economy is always in recession","All workers are discouraged","GDP cannot measure employment"], a:0, tag:"natural_unemployment", type:"interpretation", objective:"LO29.5", boss:"FinalBoss", feedback:"Frictional and structural unemployment remain even when the economy is healthy." },
{ id:4035, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"Actual unemployment is 4.2% and the natural rate is 5.0%. What does this suggest?", options:["The labor market may be unusually tight, with unemployment below its normal sustainable level","Cyclical unemployment is strongly positive","The economy must be in a deep recession","Structural unemployment is zero"], a:0, tag:"natural_unemployment", type:"interpretation", objective:"LO29.5", boss:"FinalBoss", feedback:"Actual unemployment below the natural rate can indicate unusually tight labor markets." },

// Set 13: Full labor-market diagnostic
{ id:4036, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"The Comptroller reviews the recovery file: a recession ends, but many former workers cannot find jobs because their old industry has permanently shrunk. What should policymakers diagnose?", options:["Cyclical unemployment has fallen, but structural unemployment remains","Only frictional unemployment remains","Unemployment is impossible if recession ended","Discouraged workers are all employed"], a:0, tag:"unemployment_types", type:"integration", objective:"LO29.3", boss:"FinalBoss", feedback:"Recovery can reduce cyclical unemployment while structural mismatch remains." },
{ id:4037, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"Suppose actual unemployment is 7%, natural unemployment is 4.5%, and labor force participation is falling. What is the strongest interpretation?", options:["There is likely cyclical unemployment, but falling participation means the headline rate may still understate weakness","The labor market is definitely fully healthy","Cyclical unemployment is negative 2.5 points","Participation falling proves structural unemployment is zero"], a:0, tag:"natural_unemployment", type:"integration", objective:"LO29.5", boss:"FinalBoss", feedback:"Actual unemployment exceeds natural unemployment by 2.5 points, and falling participation can hide additional weakness." },
{ id:4038, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"An economy has 200 adults, 120 employed, 10 unemployed, and 70 not in the labor force. Then 10 unemployed workers become discouraged. What are the new unemployment rate and participation rate?", options:["0% unemployment and 60% participation","5% unemployment and 65% participation","0% unemployment and 65% participation","10% unemployment and 60% participation"], a:0, tag:"labor_force_stats", type:"multi-step", objective:"LO29.1", boss:"FinalBoss", feedback:"Unemployed becomes 0 and labor force becomes 120. Unemployment = 0%; participation = 120/200 = 60%." },

// Set 14: Final boss synthesis
{ id:4039, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"The Comptroller delivers the final audit: a worker is counted as employed even though they want full-time work, another worker is not counted as unemployed because they stopped searching, and actual unemployment is above the natural rate. What is the combined lesson?", options:["The headline unemployment rate can miss underemployment and discouraged workers, while elevated actual unemployment may signal cyclical weakness","The headline unemployment rate captures all labor pain perfectly","Actual unemployment above natural unemployment means no recessionary pressure","Discouraged workers raise the unemployment rate"], a:0, tag:"labor_market_synthesis", type:"integration", objective:"LO29.1_LO29.2_LO29.5", boss:"FinalBoss", feedback:"This pulls together underemployment, discouraged workers, and cyclical unemployment. Welcome to the final boss." },
{ id:4040, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"minimum_wage_surplus", secondarySkills:["unions_efficiency_wages"], repairSkill:"minimum_wage_surplus", commonError:"Forgetting that a binding wage floor creates a surplus when labor supplied exceeds labor demanded.", q:"Minimum wages, unions, and efficiency wages can all create unemployment through which shared mechanism?", options:["They can keep wages above the market-clearing level","They always lower wages below equilibrium","They remove workers from the labor force by definition","They reduce labor supply to zero"], a:0, tag:"labor_market_policy", type:"integration", objective:"LO29.4", boss:"FinalBoss", feedback:"All three can keep wages above equilibrium, creating a surplus of labor." },
{ id:4041, difficulty:"finalBoss", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"The final boss gives three facts: job openings exist, workers lack needed skills, and unemployment remains even after demand recovers. What is the best diagnosis?", options:["Structural unemployment is the main issue","Cyclical unemployment is the only issue","Frictional unemployment from normal search is the only issue","The workers are all employed"], a:0, tag:"unemployment_types", type:"integration", objective:"LO29.3", boss:"FinalBoss", feedback:"Persistent mismatch after recovery points to structural unemployment." }

easy: [
{ id:1, difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"In the circular flow of income and expenditure, why does total income equal total expenditure?", options:["Every dollar spent by a buyer becomes income for a seller","Government sets income equal to spending","Exports always equal imports","Savings are never counted"], a:0, tag:"gdp_income_expenditure", type:"definition", objective:"LO24.1", feedback:"Income equals expenditure because one person's spending becomes another person's income." },
{ id:2, difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"If households spend $500 billion buying goods and services, what happens to sellers' income in the basic income-expenditure logic?", options:["It rises by $500 billion","It falls by $500 billion","It is unchanged","It only rises if taxes fall"], a:0, tag:"gdp_income_expenditure", type:"interpretation", objective:"LO24.1", feedback:"Spending by buyers becomes income for sellers, so seller income rises by the same amount." },
{ id:3, difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"GDP measures which two sides of economic activity?", options:["Total income and total expenditure","Taxes and imports","Profits and inflation","Wages and unemployment"], a:0, tag:"gdp_income_expenditure", type:"definition", objective:"LO24.1", feedback:"GDP can be measured as total income or total expenditure because those two sides are linked." },
{ id:4, difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"If total expenditure in an economy is $20 trillion, what is total income in the basic GDP accounting identity?", options:["$20 trillion","$10 trillion","$40 trillion","It cannot be determined"], a:0, tag:"gdp_income_expenditure", type:"calculation", objective:"LO24.1", feedback:"In the basic circular-flow logic, total expenditure equals total income." },
{ id:5, difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"Which statement best defines GDP?", options:["The market value of all final goods and services produced within a country in a given period","The total value of all used goods sold in a year","The total income earned only by government workers","The total amount of money printed by the central bank"], a:0, tag:"gdp_definition", type:"definition", objective:"LO24.2", feedback:"GDP is the market value of final goods and services produced within a country during a period." },
{ id:6, difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A newly produced car sold to a household is counted in GDP because it is:", options:["A final good produced in the current period","A used good resold in the current period","An intermediate good","A financial asset"], a:0, tag:"gdp_definition", type:"interpretation", objective:"LO24.2", feedback:"Newly produced final goods are counted in GDP." },
{ id:7, difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"intermediate_vs_final_goods", secondarySkills:["gdp_counting_rules"], repairSkill:"intermediate_vs_final_goods", commonError:"Double-counting intermediate goods instead of counting final value or value added.", q:"Why are intermediate goods usually not counted separately in GDP?", options:["Their value is already included in the final good","They are always imported","They are not produced by firms","They have no market price"], a:0, tag:"gdp_definition", type:"definition", objective:"LO24.2", feedback:"Counting intermediate goods separately would double count their value." },
{ id:8, difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"intermediate_vs_final_goods", secondarySkills:["gdp_counting_rules"], repairSkill:"intermediate_vs_final_goods", commonError:"Double-counting intermediate goods instead of counting final value or value added.", q:"A bakery buys flour for $20 and sells bread for $50. What value is counted in GDP from the final bread sale?", options:["$50","$20","$70","$30 only"], a:0, tag:"gdp_definition", type:"calculation", objective:"LO24.2", feedback:"GDP counts the final good, so the bread sale counts as $50." },
{ id:9, difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"Which purchase is not counted in current GDP?", options:["Buying a used textbook from another student","Buying a newly produced textbook","Buying a new laptop made domestically","Paying for a haircut"], a:0, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"Used goods were counted when first produced, so resale does not count in current GDP." },
{ id:10, difficulty:"easy", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"Which of the following is one of the four components of GDP expenditure?", options:["Consumption","Inflation","Unemployment","Depreciation"], a:0, tag:"gdp_components", type:"definition", objective:"LO24.3", feedback:"Consumption is one of the four expenditure components of GDP." },
{ id:11, difficulty:"easy", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"The GDP expenditure identity is:", options:["Y = C + I + G + NX","Y = C - I + G - NX","Y = wages + prices + taxes","Y = inflation + unemployment"], a:0, tag:"gdp_components", type:"definition", objective:"LO24.3", feedback:"GDP expenditure is consumption plus investment plus government purchases plus net exports." },

{ id:16, difficulty:"easy", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"Nominal GDP values output using:", options:["Current-year prices","Base-year prices","Only imported prices","Only wage rates"], a:0, tag:"real_nominal_gdp", type:"definition", objective:"LO24.4", feedback:"Nominal GDP uses current prices." },
{ id:17, difficulty:"easy", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"Real GDP values output using:", options:["Base-year prices","Current-year prices","Only export prices","Only consumer prices"], a:0, tag:"real_nominal_gdp", type:"definition", objective:"LO24.4", feedback:"Real GDP uses constant base-year prices to remove the effect of price changes." },
{ id:18, difficulty:"easy", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"If nominal GDP rises but real GDP does not, what likely happened?", options:["Prices rose but actual output did not","Actual output rose but prices fell","Imports disappeared","Unemployment must be zero"], a:0, tag:"real_nominal_gdp", type:"interpretation", objective:"LO24.4", feedback:"Nominal GDP can rise because prices rise, even if real output does not." },
{ id:19, difficulty:"easy", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"GDP is an imperfect measure of well-being because it excludes:", options:["Leisure and environmental quality","Final goods and services","Market production","Government purchases"], a:0, tag:"gdp_wellbeing", type:"definition", objective:"LO24.5", feedback:"GDP misses some things that matter for well-being, such as leisure and environmental quality." },
{ id:20, difficulty:"easy", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"Which statement about GDP and well-being is most accurate?", options:["Higher GDP often helps, but GDP is not a complete measure of well-being","GDP perfectly measures happiness","GDP ignores all market activity","GDP only measures inflation"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"GDP is useful, but it does not capture every part of economic well-being." },

{ id:21, difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"The consumer price index measures:", options:["The cost of a fixed basket of goods and services over time","The unemployment rate","The value of exports","The number of workers in the labor force"], a:0, tag:"cpi_inflation", type:"definition", objective:"LO25.1", feedback:"The CPI tracks the cost of a fixed basket of consumer goods and services." },

{ id:23, difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"If the CPI rises from 100 to 110, what is the inflation rate?", options:["10%","5%","110%","1%"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"The CPI increased by 10 points from a base of 100, so inflation is 10%." },

{ id:26, difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"One reason the CPI can overstate inflation is:", options:["Consumers substitute toward relatively cheaper goods","Consumers never change what they buy","The CPI includes only exports","The CPI ignores consumer prices"], a:0, tag:"cpi_bias", type:"definition", objective:"LO25.2", feedback:"The CPI uses a fixed basket, so it can miss substitution toward cheaper goods." },

{ id:29, difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"Unmeasured quality improvement causes CPI problems because:", options:["A higher price may partly reflect a better product","Quality is always falling","The CPI only measures wages","Quality changes are illegal"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"If goods improve in quality, price increases may overstate the rise in the cost of living." },

{ id:31, difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"The GDP deflator is based on:", options:["Goods and services produced domestically","Only imported consumer goods","Only food and energy","Only used goods"], a:0, tag:"cpi_vs_deflator", type:"definition", objective:"LO25.3", feedback:"The GDP deflator reflects prices of domestically produced goods and services." },
{ id:32, difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"An imported television bought by consumers affects which index more directly?", options:["CPI","GDP deflator","Unemployment rate","Labor force"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"Imported consumer goods are included in the CPI but not the GDP deflator." },
{ id:33, difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Which statement correctly compares the CPI and GDP deflator?", options:["The CPI uses a fixed consumer basket, while the GDP deflator reflects current domestic production","They are exactly the same index","The CPI includes only investment goods","The GDP deflator includes only imports"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"The CPI and GDP deflator both measure prices, but they use different baskets." },

{ id:39, difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"If the nominal interest rate is 8% and inflation is 3%, what is the real interest rate?", options:["5%","11%","3%","8%"], a:0, tag:"interest_inflation", type:"calculation", objective:"LO25.5", feedback:"Real interest rate = 8% - 3% = 5%." },

{ id:61, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"labor_force_calculation", secondarySkills:["unemployment_rate", "labor_force_participation"], repairSkill:"labor_force_calculation", commonError:"Forgetting that the labor force includes employed plus unemployed workers.", q:"The labor force equals:", options:["Employed plus unemployed","Adult population plus retirees","Unemployed plus not in labor force","Employed minus unemployed"], a:0, tag:"labor_force_stats", type:"definition", objective:"LO29.1", feedback:"The labor force includes people who are employed and unemployed." },
{ id:62, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"The unemployment rate is calculated as:", options:["Unemployed divided by labor force times 100","Unemployed divided by adult population times 100","Employed divided by unemployed times 100","Not in labor force divided by employed times 100"], a:0, tag:"labor_force_stats", type:"definition", objective:"LO29.1", feedback:"The unemployment rate is unemployed workers divided by the labor force." },
{ id:63, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"The labor force participation rate is calculated as:", options:["Labor force divided by adult population times 100","Unemployed divided by labor force times 100","Employed divided by unemployed times 100","Inflation divided by GDP times 100"], a:0, tag:"labor_force_stats", type:"definition", objective:"LO29.1", feedback:"Labor force participation measures the share of adults in the labor force." },
{ id:64, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"labor_force_calculation", secondarySkills:["unemployment_rate", "labor_force_participation"], repairSkill:"labor_force_calculation", commonError:"Forgetting that the labor force includes employed plus unemployed workers.", q:"If 90 people are employed and 10 are unemployed, what is the labor force?", options:["100","90","10","80"], a:0, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Labor force = employed + unemployed = 90 + 10 = 100." },
{ id:65, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"If 10 people are unemployed and the labor force is 100, what is the unemployment rate?", options:["10%","90%","100%","1%"], a:0, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Unemployment rate = 10/100 x 100 = 10%." },
{ id:66, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"If the labor force is 160 million and the adult population is 250 million, what is the labor force participation rate?", options:["64%","40%","160%","25%"], a:0, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Labor force participation = 160/250 x 100 = 64%." },
{ id:67, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A person with a paid job is classified as:", options:["Employed","Unemployed","Not in the labor force","Discouraged only"], a:0, tag:"employment_categories", type:"definition", objective:"LO29.2", feedback:"A person with a paid job is employed." },
{ id:68, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A person without a job who has actively looked for work in the last four weeks is classified as:", options:["Unemployed","Employed","Not in the labor force","Retired only"], a:0, tag:"employment_categories", type:"definition", objective:"LO29.2", feedback:"Someone without a job who is actively looking is unemployed." },
{ id:69, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A retired person who is not looking for work is classified as:", options:["Not in the labor force","Unemployed","Employed","Structurally unemployed"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"People not working and not looking for work are not in the labor force." },
{ id:70, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"discouraged_workers", secondarySkills:["employment_classification"], repairSkill:"discouraged_workers", commonError:"Counting discouraged workers as unemployed even after they stop actively searching.", q:"A discouraged worker is usually counted as:", options:["Not in the labor force","Unemployed","Employed","Part of GDP"], a:0, tag:"employment_categories", type:"definition", objective:"LO29.2", feedback:"Discouraged workers are not counted as unemployed because they are not actively looking for work." },
{ id:71, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"Frictional unemployment is caused by:", options:["The time it takes workers to search for suitable jobs","A long-term mismatch between skills and jobs","A recession lowering demand","A price index rising"], a:0, tag:"unemployment_types", type:"definition", objective:"LO29.3", feedback:"Frictional unemployment comes from job search and matching." },
{ id:72, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"Structural unemployment is caused by:", options:["A mismatch between worker skills and available jobs","Workers moving between jobs briefly","A temporary vacation","GDP accounting rules"], a:0, tag:"unemployment_types", type:"definition", objective:"LO29.3", feedback:"Structural unemployment occurs when workers' skills or locations do not match available jobs." },
{ id:73, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"cyclical_unemployment", secondarySkills:["natural_rate"], repairSkill:"cyclical_unemployment", commonError:"Confusing recession-driven unemployment with natural unemployment.", q:"Cyclical unemployment is associated with:", options:["Downturns in the business cycle","Normal job search only","A fixed CPI basket","Higher physical capital"], a:0, tag:"unemployment_types", type:"definition", objective:"LO29.3", feedback:"Cyclical unemployment rises during recessions or weak economic conditions." },
{ id:74, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A worker quits one job and spends two weeks looking for a better one. This is:", options:["Frictional unemployment","Structural unemployment","Cyclical unemployment","Not in the labor force"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"Short-term job search is frictional unemployment." },
{ id:75, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A factory worker loses a job because the industry permanently shifts to automation and the worker lacks new skills. This is:", options:["Structural unemployment","Frictional unemployment","Cyclical unemployment","Inflation"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"A lasting skills mismatch is structural unemployment." },
{ id:76, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"cyclical_unemployment", secondarySkills:["natural_rate"], repairSkill:"cyclical_unemployment", commonError:"Confusing recession-driven unemployment with natural unemployment.", q:"A worker loses a job because a recession causes customers to spend less. This is:", options:["Cyclical unemployment","Frictional unemployment","Structural unemployment","Natural unemployment"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"Job loss from weak demand during a recession is cyclical unemployment." },
{ id:77, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"Unemployment insurance may increase frictional unemployment because it can:", options:["Reduce the urgency of job search","Eliminate all job search","Lower every wage to zero","Remove workers from the adult population"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Unemployment insurance can reduce the cost of continued job search, which may lengthen unemployment spells." },
{ id:78, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"minimum_wage_surplus", secondarySkills:["unions_efficiency_wages"], repairSkill:"minimum_wage_surplus", commonError:"Forgetting that a binding wage floor creates a surplus when labor supplied exceeds labor demanded.", q:"A binding minimum wage can create unemployment because it:", options:["Raises the wage above equilibrium and creates a surplus of labor","Lowers wages below equilibrium","Increases labor demand above labor supply","Makes all workers employed"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"A binding minimum wage can create a surplus of labor, meaning more workers want jobs than firms want to hire." },
{ id:79, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"Unions can contribute to unemployment when they:", options:["Push wages above equilibrium in unionized labor markets","Lower wages below equilibrium","Remove all bargaining power from workers","Make labor demand vertical"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Union wage bargaining can raise wages above equilibrium and reduce the quantity of labor demanded." },
{ id:80, difficulty:"easy", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"The natural rate of unemployment exists because:", options:["Even in the long run, frictional and structural unemployment remain","Cyclical unemployment is always zero in recessions","No one ever changes jobs","The labor force never changes"], a:0, tag:"natural_unemployment", type:"definition", objective:"LO29.5", feedback:"The natural rate reflects unemployment that remains from normal job search and structural mismatches." }
],

medium: [
{ id:100, difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"A student says GDP can be measured by adding up either total income or total expenditure. Why is that true?", options:["Every transaction has a buyer and a seller, so spending by one party becomes income for another","GDP only counts income earned by households, not spending","The government adjusts income until it equals spending","Exports and imports must always be equal"], a:0, tag:"gdp_income_expenditure", type:"interpretation", objective:"LO24.1", feedback:"The income and expenditure approaches match because each dollar spent becomes income to someone else." },
{ id:101, difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"Suppose firms sell $900 billion of final goods and households, firms, government, and foreigners buy all of it. What should total income from producing those goods equal?", options:["$0","$450 billion","$900 billion","It depends only on taxes"], a:2, tag:"gdp_income_expenditure", type:"calculation", objective:"LO24.1", feedback:"Total expenditure on final output becomes total income earned from producing that output." },
{ id:102, difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"Which example best shows the income-expenditure identity in action?", options:["A firm sells a $40 meal and the restaurant receives $40 in revenue","A used car is resold and counted twice in GDP","A government transfer payment raises GDP directly","A household saves money under a mattress"], a:0, tag:"gdp_income_expenditure", type:"interpretation", objective:"LO24.1", feedback:"The restaurant sale shows spending by the buyer becoming income to the seller." },
{ id:103, difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"If total income in an economy is $18 trillion and inventories do not create a measurement gap, total expenditure should be:", options:["$9 trillion","$18 trillion","$36 trillion","Impossible to compare"], a:1, tag:"gdp_income_expenditure", type:"calculation", objective:"LO24.1", feedback:"In GDP accounting, total income and total expenditure are two ways of measuring the same economic activity." },
{ id:104, difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"Which transaction is counted in U.S. GDP?", options:["A U.S. company buys shares of another company","A U.S. household buys a used refrigerator","A German tourist pays for a hotel room in Florida","A U.S. citizen buys a used car from a neighbor"], a:2, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"The hotel service is produced in the United States, so it counts in U.S. GDP." },
{ id:105, difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"intermediate_vs_final_goods", secondarySkills:["gdp_counting_rules"], repairSkill:"intermediate_vs_final_goods", commonError:"Double-counting intermediate goods instead of counting final value or value added.", q:"A farmer sells wheat to a miller for $100. The miller sells flour to a baker for $160. The baker sells bread to consumers for $250. How much is added to GDP?", options:["$100","$160","$250","$510"], a:2, tag:"gdp_definition", type:"calculation", objective:"LO24.2", feedback:"GDP counts the final bread sale of $250, not each intermediate transaction separately." },
{ id:106, difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A laptop produced last year is sold used this year for $700. How does this affect this year's GDP?", options:["GDP rises by $700","GDP rises only if the laptop was imported","GDP does not rise from the used-good sale","GDP rises by the original price"], a:2, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"Used goods are not counted in current GDP because they were counted when first produced." },
{ id:107, difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A homeowner pays a contractor $12,000 to renovate a kitchen. Why is this counted in GDP?", options:["It is a market service produced during the current period","It is a transfer payment","It is a used good","It is counted only if paid in cash"], a:0, tag:"gdp_definition", type:"interpretation", objective:"LO24.2", feedback:"Paid renovation work is current market production and is counted in GDP." },
{ id:108, difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"Which item would be excluded from GDP because it is non-market production?", options:["A paid haircut","A restaurant meal","A person mowing their own lawn","A new home purchase"], a:2, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"Unpaid work performed for yourself is generally not counted in GDP." },
{ id:109, difficulty:"medium", conceptCluster:"gdp_components", primarySkill:"imports_exports_nx", secondarySkills:["gdp_components_identity"], repairSkill:"imports_exports_nx", commonError:"Adding imports instead of subtracting them through net exports.", q:"If consumption is $12 trillion, investment is $4 trillion, government purchases are $5 trillion, exports are $3 trillion, and imports are $4 trillion, what is GDP?", options:["$20 trillion","$21 trillion","$24 trillion","$28 trillion"], a:0, tag:"gdp_components", type:"calculation", objective:"LO24.3", feedback:"GDP = C + I + G + NX = 12 + 4 + 5 + (3 - 4) = 20." },
{ id:110, difficulty:"medium", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A household buys a newly built home. In GDP accounting, this is counted as:", options:["Consumption","Investment","Government purchases","Net exports"], a:1, tag:"gdp_components", type:"interpretation", objective:"LO24.3", feedback:"New residential construction is counted as investment, not consumption." },
{ id:111, difficulty:"medium", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A state government pays workers to repair highways. Which GDP component rises?", options:["Consumption","Investment","Government purchases","Net exports"], a:2, tag:"gdp_components", type:"interpretation", objective:"LO24.3", feedback:"Government spending on goods and services is counted as government purchases." },
{ id:112, difficulty:"medium", conceptCluster:"gdp_components", primarySkill:"imports_exports_nx", secondarySkills:["gdp_components_identity"], repairSkill:"imports_exports_nx", commonError:"Adding imports instead of subtracting them through net exports.", q:"If exports are $800 billion and imports are $1.1 trillion, net exports equal:", options:["$300 billion","-$300 billion","$1.9 trillion","-$1.9 trillion"], a:1, tag:"gdp_components", type:"calculation", objective:"LO24.3", feedback:"Net exports = exports - imports = 800 - 1100 = -300 billion." },
{ id:113, difficulty:"medium", conceptCluster:"gdp_components", primarySkill:"inventory_investment", secondarySkills:["gdp_components_identity"], repairSkill:"inventory_investment", commonError:"Excluding unsold current production instead of counting it as inventory investment.", q:"A U.S. firm produces $10 million in goods but sells only $7 million this year. The remaining $3 million is added to inventories. How much is counted in GDP?", options:["$7 million","$3 million","$10 million","$0"], a:2, tag:"gdp_components", type:"calculation", objective:"LO24.3", feedback:"Unsold output is counted as inventory investment, so all $10 million is counted." },
{ id:114, difficulty:"medium", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"Which transaction increases investment in GDP accounting?", options:["A household buys groceries","A firm buys new delivery trucks","The government sends unemployment benefits","A consumer buys imported shoes"], a:1, tag:"gdp_components", type:"interpretation", objective:"LO24.3", feedback:"Business purchases of new capital goods are investment." },
{ id:115, difficulty:"medium", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"Suppose an economy produces only 10 bikes. In year 1, each bike sells for $100. In year 2, the economy still produces 10 bikes but each sells for $120. What happens?", options:["Nominal GDP rises, but real GDP is unchanged if year 1 is the base year","Real GDP rises, but nominal GDP is unchanged","Both nominal and real GDP must fall","GDP cannot be calculated"], a:0, tag:"real_nominal_gdp", type:"interpretation", objective:"LO24.4", feedback:"Nominal GDP rises because prices rise, while real GDP is unchanged because output did not change." },
{ id:116, difficulty:"medium", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"If nominal GDP is $24 trillion and the GDP deflator is 120, real GDP is:", options:["$20 trillion","$24 trillion","$28.8 trillion","$120 trillion"], a:0, tag:"real_nominal_gdp", type:"calculation", objective:"LO24.4", feedback:"Real GDP = nominal GDP / (deflator/100) = 24 / 1.20 = 20 trillion." },
{ id:117, difficulty:"medium", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"Which situation would cause real GDP to rise?", options:["Prices rise while output stays the same","Output rises while base-year prices are used","The CPI rises while production is unchanged","Used goods are resold more often"], a:1, tag:"real_nominal_gdp", type:"interpretation", objective:"LO24.4", feedback:"Real GDP rises when actual production rises, not merely when prices rise." },
{ id:118, difficulty:"medium", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"Why can GDP rise while well-being does not clearly improve?", options:["GDP may ignore pollution, leisure loss, and unequal distribution","GDP counts no market activity","GDP only measures imports","GDP excludes all government services"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"GDP is useful, but it misses important quality-of-life factors." },
{ id:119, difficulty:"medium", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"Which statement is the strongest evaluation of GDP as a welfare measure?", options:["GDP is useless because it excludes happiness","GDP is useful because income matters, but incomplete because it misses non-market and quality-of-life factors","GDP perfectly measures economic well-being","GDP only measures government production"], a:1, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"GDP is useful but incomplete as a measure of well-being." },

{ id:120, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"A CPI basket costs $400 in the base year and $460 this year. What is the CPI this year?", options:["87","115","160","460"], a:1, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"CPI = 100 x 460/400 = 115." },
{ id:121, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"If the CPI rises from 150 to 165, what is the inflation rate?", options:["10%","15%","65%","110%"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Inflation = (165 - 150)/150 x 100 = 10%." },
{ id:122, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"If the CPI falls from 200 to 190, what happened?", options:["There was 5% inflation","There was 5% deflation","There was 10% inflation","The real interest rate must be zero"], a:1, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"The CPI fell by 10 from 200, so the inflation rate is -5%, meaning deflation." },
{ id:123, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"A basket has 4 pizzas and 2 haircuts. In the base year, pizzas cost $10 and haircuts cost $20. This year, pizzas cost $12 and haircuts cost $25. What is this year's CPI?", options:["100","120","122.5","125"], a:2, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Base basket cost = 4(10)+2(20)=80. Current cost = 4(12)+2(25)=98. CPI = 122.5." },
{ id:124, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"If the CPI is 140, what does that mean relative to the base year?", options:["The basket costs 40% more than in the base year","The basket costs 140% less than in the base year","Inflation this year is exactly 140%","Real GDP is 140"], a:0, tag:"cpi_inflation", type:"interpretation", objective:"LO25.1", feedback:"A CPI of 140 means the basket costs 40% more than in the base year." },
{ id:125, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"A CPI basket keeps 10 pounds of beef even after beef becomes expensive and consumers switch to chicken. Which CPI problem is this?", options:["Substitution bias","Discouraged-worker bias","GDP deflator bias","Natural-rate bias"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"A fixed basket can miss consumer substitution toward cheaper goods." },
{ id:126, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"Why does substitution bias usually cause the CPI to overstate inflation?", options:["Consumers can reduce the burden of price increases by buying relatively cheaper substitutes","Consumers never change behavior when prices change","The CPI ignores all prices","The CPI counts used goods twice"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"If consumers substitute, their actual cost of living may rise less than the fixed basket suggests." },
{ id:127, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"A smartphone costs more than an old flip phone but also provides far more services. Which CPI issue does this illustrate?", options:["Unmeasured quality change","Cyclical unemployment","Net export measurement","GDP identity failure"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"Some price increases reflect quality improvements, which the CPI may not fully measure." },
{ id:128, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"A new product gives consumers a useful option that did not previously exist. Why can that make the CPI imperfect?", options:["The CPI may miss gains from new variety and improved purchasing power","The CPI counts only unemployment","The CPI automatically falls to zero","The new product must be an intermediate good"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"New goods can make consumers better off in ways not fully captured by the CPI." },
{ id:129, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"Which example would most likely make the CPI overstate the true rise in the cost of living?", options:["Consumers switch from expensive beef to cheaper chicken","All consumers buy exactly the fixed CPI basket forever","Quality falls but prices fall more","Imports disappear from stores"], a:0, tag:"cpi_bias", type:"trap", objective:"LO25.2", feedback:"Substitution toward cheaper goods means the fixed basket may exaggerate cost increases." },
{ id:130, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Which price change affects the CPI but not the GDP deflator directly?", options:["A price increase for imported coffee bought by households","A price increase for domestically produced tractors","A price increase for government services","A price increase for domestically produced bread"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"Imported consumer goods are included in the CPI but excluded from the GDP deflator." },
{ id:131, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Which price index better captures prices of all currently produced domestic final goods and services?", options:["CPI","GDP deflator","Unemployment rate","Labor force participation rate"], a:1, tag:"cpi_vs_deflator", type:"definition", objective:"LO25.3", feedback:"The GDP deflator reflects the prices of domestically produced final goods and services." },
{ id:132, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Why can the GDP deflator change differently from the CPI?", options:["The GDP deflator uses current domestic production, while the CPI uses a fixed consumer basket","They measure exactly the same basket","The GDP deflator only counts imports","The CPI ignores consumer prices"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"The CPI and GDP deflator use different baskets and coverage." },
{ id:133, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"A domestically produced machine purchased by a business becomes more expensive. Which index is more likely to capture this directly?", options:["GDP deflator","CPI","Unemployment rate","Labor force participation rate"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"Capital goods produced domestically are included in GDP and affect the GDP deflator." },
{ id:134, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A salary was $30,000 when the CPI was 150. The CPI is now 225. What is that salary in today's dollars?", options:["$20,000","$30,000","$45,000","$67,500"], a:2, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"Today's dollars = 30000 x 225/150 = 45000." },
{ id:135, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A movie ticket cost $4 when the CPI was 80. The CPI is now 240. What is the ticket price in today's dollars?", options:["$8","$12","$16","$20"], a:1, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"Today's dollars = 4 x 240/80 = 12." },
{ id:136, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"Why is it misleading to compare a $5 wage in 1970 directly to a $15 wage today?", options:["The purchasing power of money changes over time","Wages are not prices","Inflation only affects GDP, not wages","Nominal values are always real values"], a:0, tag:"inflation_adjustment", type:"interpretation", objective:"LO25.4", feedback:"Dollar amounts from different years need to be adjusted for changes in the price level." },
