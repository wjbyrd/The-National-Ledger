{ id:9059, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A low-capital economy gets basic tools and output jumps sharply. Later, additional tools add smaller gains. Which pattern is this?", options:["Catch-up effect followed by diminishing returns","CPI substitution bias followed by inflation","Frictional unemployment followed by cyclical unemployment","Imports followed by exports"], a:0, tag:"catch_up_growth", type:"integration", objective:"LO26.3", feedback:"Capital is highly productive when scarce, but additional capital eventually yields smaller gains." },
{ id:9060, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"A country encourages saving but has corrupt courts and frequent asset seizure. Why might investment still remain weak?", options:["People may save, but weak property rights reduce the incentive to commit funds to productive investment","Saving always guarantees investment","Courts affect only unemployment statistics","Asset seizure increases capital accumulation"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Saving supports investment only when institutions make investment secure enough to undertake." },
{ id:9061, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"A government blocks foreign investment to protect domestic firms. What long-run growth cost is most plausible?", options:["Less capital inflow, less technology transfer, and weaker productivity growth","Higher productivity from isolation by definition","Immediate doubling of human capital","Elimination of diminishing returns"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Foreign investment can bring capital, technology, and management know-how." },
{ id:9062, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"A country invests in education but prevents firms from adopting new technology. What is the main problem?", options:["Human capital may not translate fully into productivity without complementary technology and capital","Education is unrelated to productivity","Technology always reduces human capital","Growth depends only on natural resources"], a:0, tag:"growth_policy", type:"integration", objective:"LO26.4", feedback:"Human capital, physical capital, and technology work together." },
{ id:9063, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Which policy package best targets productivity rather than merely short-run demand?", options:["R&D support, stable property rights, education, infrastructure, and investment incentives","Temporary rebates only","Price ceilings on output","Higher transfer payments without investment"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Long-run productivity policy builds capital, skills, technology, and institutions." },
{ id:9064, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Why can population growth reduce GDP per person even while raising total GDP?", options:["More workers can raise total output, but capital per worker and output per person may fall if capital does not keep up","Population growth always raises productivity","GDP per person ignores population","Capital per worker automatically rises with population"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Population growth can dilute capital per worker unless investment keeps pace." },
{ id:9065, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A poor country and a rich country both add $1,000 of capital per worker. Why might the poor country gain more output per worker?", options:["Capital is scarcer, so its marginal product may be higher","Rich countries never use capital","Poor countries do not face diminishing returns","The CPI is lower in poor countries"], a:0, tag:"catch_up_growth", type:"interpretation", objective:"LO26.3", feedback:"The catch-up effect depends on higher marginal returns to capital where capital is scarce." },
{ id:9066, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A country's real GDP per worker rises while real GDP per person is flat. What likely happened?", options:["The share of the population working fell or population composition changed","Productivity must have fallen","Real GDP must have fallen","The CPI must have doubled"], a:0, tag:"productivity", type:"integration", objective:"LO26.2", feedback:"Output per worker can rise while output per person remains flat if fewer people are working relative to population." },

{ id:9067, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"An economy has 170M employed, 10M unemployed, and 70M not in the labor force. Then 5M unemployed become discouraged and 5M not in the labor force find jobs. What is the new unemployment rate?", options:["2.78%","5.56%","5.26%","8.33%"], a:0, tag:"labor_force_stats", type:"multi-step", objective:"LO29.1", feedback:"New employed = 175M, unemployed = 5M, labor force = 180M. Unemployment = 5/180 = 2.78%." },
{ id:9068, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"Adult population is 280M, labor force participation is 65%, and unemployment rate is 6%. How many people are employed?", options:["171.08M","182M","16.8M","263.2M"], a:0, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Labor force = 0.65 x 280 = 182M. Unemployed = 0.06 x 182 = 10.92M. Employed = 171.08M." },
{ id:9069, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"An economy has 90 employed, 10 unemployed, and 50 not in the labor force. Five employed workers lose jobs and search; five unemployed workers stop searching. What happens to unemployment rate?", options:["It rises slightly to 10.5%","It rises to 15%","It falls to 5%","It becomes 0%"], a:0, tag:"labor_force_stats", type:"multi-step", objective:"LO29.1", feedback:"Employed falls to 85; unemployed remains 10; labor force remains 95? Wait: original LF 100; five employed become unemployed, five unemployed leave LF, so LF = 95 and unemployed = 10. Rate = 10/95 = 10.53%, so no listed answer is exact." },
{ id:9070, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"The unemployment rate falls while labor force participation also falls. Which interpretation is most careful?", options:["Some improvement may be real, but worker exit from the labor force may also be lowering measured unemployment","The labor market definitely improved","Employment must have risen","Cyclical unemployment must be zero"], a:0, tag:"labor_force_stats", type:"interpretation", objective:"LO29.1", feedback:"A falling unemployment rate can be misleading when participation falls." },
{ id:9071, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A jobless worker applied to three jobs last week. Another jobless worker wants work but last searched two months ago. A third works 3 hours per week but wants full-time work. How are they classified?", options:["Unemployed; not in labor force; employed","Unemployed; unemployed; unemployed","Employed; unemployed; not in labor force","Not in labor force; unemployed; employed"], a:0, tag:"employment_categories", type:"multi-step", objective:"LO29.2", feedback:"Recent active search means unemployed; no recent search means not in labor force; any paid work means employed." },
{ id:9072, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"Which case makes the headline unemployment rate look better than the actual labor market experience?", options:["A rise in discouraged workers and involuntary part-time workers","A rise in full-time employment","More unemployed workers actively searching","More job openings filled"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Discouraged and involuntary part-time workers are not fully captured by the headline unemployment rate." },
{ id:9073, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A worker is laid off because a recession reduces sales. Six months later, the worker's old industry adopts technology that permanently eliminates the job type. How should the unemployment diagnosis change?", options:["It begins as cyclical but may become structural if the old job type does not return","It is always frictional","It is never unemployment","It must be natural unemployment only"], a:0, tag:"unemployment_types", type:"integration", objective:"LO29.3", feedback:"Weak demand causes cyclical unemployment, but permanent skill/job mismatch is structural." },
{ id:9074, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A nurse moving between hospitals, a cashier displaced by automation, and a waiter laid off during recession represent which types, in order?", options:["Frictional, structural, cyclical","Structural, frictional, cyclical","Cyclical, structural, frictional","Frictional, cyclical, structural"], a:0, tag:"unemployment_types", type:"multi-step", objective:"LO29.3", feedback:"Job search is frictional; automation mismatch is structural; recession layoff is cyclical." },
{ id:9075, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"Why does the natural rate of unemployment not equal zero?", options:["Search frictions and structural mismatches remain even in normal times","Cyclical unemployment is permanent","Everyone who wants work is always counted as unemployed","Minimum wages always bind every labor market"], a:0, tag:"natural_unemployment", type:"interpretation", objective:"LO29.5", feedback:"The natural rate includes frictional and structural unemployment." },
{ id:9076, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"minimum_wage_surplus", secondarySkills:["unions_efficiency_wages"], repairSkill:"minimum_wage_surplus", commonError:"Forgetting that a binding wage floor creates a surplus when labor supplied exceeds labor demanded.", q:"A minimum wage rises above equilibrium. At the new wage, 140 workers want jobs and firms hire 95. What is the labor surplus, and what does it represent?", options:["45 workers; unemployment created by the wage floor","235 workers; total labor market size","95 workers; employment created by the wage floor","140 workers; labor demand"], a:0, tag:"labor_market_policy", type:"calculation", objective:"LO29.4", feedback:"Surplus = quantity supplied - quantity demanded = 140 - 95 = 45 workers." },
{ id:9077, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"Unemployment insurance becomes more generous. Which is the best balanced evaluation?", options:["It protects income and may improve job matching, but can lengthen search and raise frictional unemployment","It only creates structural unemployment","It eliminates job search costs without tradeoffs","It guarantees lower natural unemployment"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Unemployment insurance has benefits and search-incentive tradeoffs." },
{ id:9078, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"A union wage raises pay from $18 to $25. Firms reduce employment, but workers who remain employed earn more. What is the insider-outsider issue?", options:["Employed union workers may benefit while workers priced out of jobs lose","All workers gain equally","The unemployment rate must fall","Only consumers of imports are affected"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Union wage gains can create benefits for insiders and costs for outsiders." },
{ id:9079, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"A firm pays above-market wages and observes lower quits, more applicants, and better effort. Why can this wage persist?", options:["The wage may pay for itself through efficiency-wage effects","The firm is violating GDP accounting","Higher wages always reduce productivity","The wage must create cyclical unemployment only"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Efficiency wages can raise productivity, reduce turnover, and attract better workers." },
{ id:9080, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"cyclical_unemployment", secondarySkills:["natural_rate"], repairSkill:"cyclical_unemployment", commonError:"Confusing recession-driven unemployment with natural unemployment.", q:"The economy recovers from recession, but unemployment remains elevated among workers whose skills no longer match job openings. What remains after cyclical unemployment falls?", options:["Structural unemployment","Only frictional unemployment","No unemployment","Inflation unemployment"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"Persistent mismatch after recovery is structural unemployment." },
{ id:9081, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"If unemployed workers stop searching at the same time firms hire some unemployed workers, why is the unemployment rate hard to interpret?", options:["It may fall for both good reasons and bad reasons at the same time","It must rise because employment rises","It becomes meaningless because GDP changes","It always equals labor force participation"], a:0, tag:"labor_force_stats", type:"interpretation", objective:"LO29.1", feedback:"Hiring improves labor markets, but labor-force exit can also reduce measured unemployment." },
{ id:9082, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"Which policy most directly targets structural unemployment?", options:["Retraining workers for expanding industries","More generous unemployment insurance with no training","Lowering the CPI basket cost","Changing GDP from nominal to real"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Structural unemployment comes from mismatch, so retraining can help." },
{ id:9083, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"Which policy most directly affects frictional unemployment?", options:["Job-search assistance that improves matching speed","A tariff on imports","A new GDP deflator base year","A tax on capital gains"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Frictional unemployment is about search and matching, so better matching can reduce it." },
{ id:9084, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A country has low unemployment but many workers are involuntarily part time. What is the best conclusion?", options:["The headline unemployment rate may understate labor underutilization","The economy must be at full well-being","All part-time work is unemployment","Labor force participation must be zero"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Workers can be counted as employed even when their hours are inadequate." },
{ id:9085, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"Suppose natural unemployment is 4.5% and actual unemployment is 8%. What is the likely cyclical unemployment?", options:["3.5 percentage points","4.5 percentage points","8 percentage points","12.5 percentage points"], a:0, tag:"natural_unemployment", type:"calculation", objective:"LO29.5", feedback:"Cyclical unemployment is actual minus natural: 8 - 4.5 = 3.5 percentage points." },
{ id:9086, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"Suppose actual unemployment is 4%, natural unemployment is 5%, and inflationary pressure is rising. What is the likely labor-market interpretation?", options:["The economy may be operating below the natural rate, creating unusually tight labor markets","Cyclical unemployment is strongly positive","Structural unemployment must be zero","All unemployment is discouraged workers"], a:0, tag:"natural_unemployment", type:"interpretation", objective:"LO29.5", feedback:"Actual unemployment below the natural rate suggests tight labor markets and possible inflationary pressure." },
{ id:9087, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A worker is unemployed because moving to available jobs is too costly, even though jobs exist elsewhere. Which type is most likely?", options:["Structural unemployment","Frictional unemployment only","Cyclical unemployment only","Not in the labor force"], a:0, tag:"unemployment_types", type:"trap", objective:"LO29.3", feedback:"Geographic mismatch is a form of structural unemployment." },
{ id:9088, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"A recession increases layoffs, while unemployment insurance helps workers avoid immediate hardship but lengthens some searches. Which pair of concepts is involved?", options:["Cyclical unemployment and frictional unemployment incentives","Only structural unemployment","GDP deflator and CPI","Natural resources and capital deepening"], a:0, tag:"labor_market_policy", type:"integration", objective:"LO29.4", feedback:"The recession creates cyclical unemployment; unemployment insurance affects job-search incentives." },
{ id:9089, difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"If measured unemployment falls because 1M unemployed workers become discouraged, while employment is unchanged, what happens to labor force participation?", options:["It falls","It rises","It stays unchanged","It becomes equal to unemployment"], a:0, tag:"labor_force_stats", type:"interpretation", objective:"LO29.1", feedback:"Discouraged workers leave the labor force, so labor force participation falls." }
],
legendaryBoss: [
{ id:9100, difficulty:"legendaryBoss", conceptCluster:"gdp_components", primarySkill:"imports_exports_nx", secondarySkills:["gdp_components_identity"], repairSkill:"imports_exports_nx", commonError:"Adding imports instead of subtracting them through net exports.", q:"Boss Audit: C = $12T, I = $3T, G = $4T, exports = $2T, imports = $3T. Households then buy $1T more imported goods and no domestic production changes. What is final GDP?", options:["$18T","$19T","$17T","$20T"], a:0, tag:"gdp_components", type:"multi-step", objective:"LO24.3", feedback:"Initial GDP = 12 + 3 + 4 + (2 - 3) = 18. Imported consumption raises C and lowers NX equally, so GDP stays 18." },
{ id:9101, difficulty:"legendaryBoss", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"Boss Audit: A firm produces $400M, sells $340M, and adds $60M to inventory. Income paid to workers, lenders, landlords, and owners totals $400M. Which answer survives the ledger?", options:["GDP is $400M by both expenditure and income logic","GDP is $340M because only sold goods count","GDP is $460M because inventory adds to sales twice","GDP is $60M because only unsold goods are investment"], a:0, tag:"gdp_income_expenditure", type:"multi-step", objective:"LO24.1", feedback:"Inventory investment counts, so expenditure GDP is $400M. Income generated is also $400M." },
{ id:9102, difficulty:"legendaryBoss", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"Boss Audit: A U.S. company produces $700M abroad, while a foreign company produces $600M inside the U.S. What is counted in U.S. GDP?", options:["$600M","$700M","$1.3B","$100M"], a:0, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"U.S. GDP counts production inside U.S. borders, regardless of ownership." },
{ id:9103, difficulty:"legendaryBoss", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"Boss Audit: Nominal GDP rises from $40T to $48T, and the GDP deflator rises from 125 to 150. What happens to real GDP?", options:["It is unchanged at $32T","It rises from $32T to $48T","It rises from $40T to $48T","It falls from $32T to $30T"], a:0, tag:"real_nominal_gdp", type:"calculation", objective:"LO24.4", feedback:"Initial real GDP = 40/1.25 = 32. New real GDP = 48/1.50 = 32." },
{ id:9104, difficulty:"legendaryBoss", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"Boss Audit: In year 1, an economy produces 10 units at $50. In year 2, it produces 12 units at $70. Using year 1 as base, what are year 2 nominal GDP, real GDP, and deflator?", options:["$840, $600, 140","$600, $840, 71.4","$840, $840, 100","$500, $600, 120"], a:0, tag:"real_nominal_gdp", type:"multi-step", objective:"LO24.4", feedback:"Nominal = 12 x 70 = 840. Real = 12 x 50 = 600. Deflator = 840/600 x 100 = 140." },
{ id:9105, difficulty:"legendaryBoss", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"Boss Audit: A flood destroys homes, then rebuilding raises measured GDP. Which judgment is most defensible?", options:["GDP rises from rebuilding but well-being may still be lower because lost assets and hardship are not fully captured","GDP proves the flood improved welfare","GDP excludes rebuilding after disasters","GDP falls whenever reconstruction occurs"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"GDP counts current production but misses much of the welfare loss from destruction." },
{ id:9106, difficulty:"legendaryBoss", conceptCluster:"gdp_components", primarySkill:"imports_exports_nx", secondarySkills:["gdp_components_identity"], repairSkill:"imports_exports_nx", commonError:"Adding imports instead of subtracting them through net exports.", q:"Boss Audit: A household buys a new domestically built house for $300,000, a used car for $20,000, and $10,000 of imported furniture. What directly adds to domestic GDP?", options:["$300,000","$330,000","$320,000","$310,000"], a:0, tag:"gdp_components", type:"trap", objective:"LO24.3", feedback:"The new domestic house counts as residential investment. Used car resale and imported furniture do not add to domestic GDP." },
{ id:9107, difficulty:"legendaryBoss", conceptCluster:"gdp_measurement", primarySkill:"intermediate_vs_final_goods", secondarySkills:["gdp_counting_rules"], repairSkill:"intermediate_vs_final_goods", commonError:"Double-counting intermediate goods instead of counting final value or value added.", q:"Boss Audit: A final good sells for $500 after using $180 of imported inputs and $120 of domestic intermediate inputs. What is domestic value added if the domestic intermediate input was already produced this period?", options:["$320 at the final stage, but total GDP should include domestic value added across all domestic stages, not imported value","$500 because imports are domestic once used","$180 because imported inputs dominate","$620 because all inputs and final output are added"], a:0, tag:"gdp_definition", type:"integration", objective:"LO24.2", feedback:"Domestic GDP tracks domestic value added, not imported input value, and avoids double counting domestic intermediate goods." },
{ id:9108, difficulty:"legendaryBoss", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"Boss Audit: A basket costs $1,000 in the base year, $1,250 last year, and $1,375 this year. What are last year's CPI, this year's CPI, and this year's inflation rate?", options:["125, 137.5, 10%","125, 137.5, 37.5%","100, 137.5, 10%","125, 110, 10%"], a:0, tag:"cpi_inflation", type:"multi-step", objective:"LO25.1", feedback:"CPI values are 125 and 137.5. Inflation = (137.5 - 125)/125 = 10%." },
{ id:9109, difficulty:"legendaryBoss", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"Boss Audit: Beef doubles in price, chicken rises 10%, and consumers switch heavily from beef to chicken. What likely happens to CPI-measured inflation?", options:["It likely overstates cost-of-living growth because the fixed basket misses substitution","It understates inflation because beef doubled","It perfectly captures consumer adjustment","It becomes the GDP deflator"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"The fixed basket does not fully capture substitution toward relatively cheaper goods." },
{ id:9110, difficulty:"legendaryBoss", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"Boss Audit: A product rises from $800 to $1,000, but quality improves enough that consumers get twice the useful service. What is the CPI problem?", options:["Measured inflation may overstate true cost-of-living growth because quality improved","Measured inflation must be exactly 25% in welfare terms","The product must be removed from GDP","The real interest rate rises automatically"], a:0, tag:"cpi_bias", type:"trap", objective:"LO25.2", feedback:"Quality improvements mean the price increase is not pure inflation." },
{ id:9111, difficulty:"legendaryBoss", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Boss Audit: Imported consumer goods rise sharply in price while domestically produced capital goods fall sharply. Which result is plausible?", options:["CPI rises while GDP deflator falls","Both must rise equally","GDP deflator rises while CPI cannot change","Neither can change because quantities are fixed"], a:0, tag:"cpi_vs_deflator", type:"integration", objective:"LO25.3", feedback:"CPI includes imported consumer goods; the GDP deflator reflects domestic production prices, including capital goods." },
{ id:9112, difficulty:"legendaryBoss", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"Boss Audit: A salary was $48,000 when CPI was 120. CPI is now 210. What salary today has equal purchasing power?", options:["$84,000","$57,600","$27,429","$100,800"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"Today's dollars = 48,000 x 210/120 = 84,000." },
{ id:9113, difficulty:"legendaryBoss", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"Boss Audit: A current salary of $105,000 equals $75,000 in year-T dollars. CPI today is 280. What was CPI in year T?", options:["200","196","210","150"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"75,000 = 105,000 x CPI_T/280, so CPI_T = 200." },
{ id:9114, difficulty:"legendaryBoss", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"Boss Audit: A lender expects 2% inflation and charges 7%. Actual inflation is 9%. What are expected and actual real returns?", options:["Expected 5%; actual -2%","Expected 9%; actual 7%","Expected -5%; actual 2%","Expected 7%; actual 9%"], a:0, tag:"interest_inflation", type:"multi-step", objective:"LO25.5", feedback:"Expected real = 7 - 2 = 5. Actual real = 7 - 9 = -2." },
{ id:9115, difficulty:"legendaryBoss", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"Boss Audit: CPI inflation is high, but the CPI misses substitution toward cheaper goods and quality improvements. What is the strongest interpretation?", options:["The true cost-of-living increase may be lower than measured CPI inflation","The true cost-of-living increase must be higher","The GDP deflator must equal CPI","Real interest rates cannot be calculated"], a:0, tag:"cpi_bias", type:"integration", objective:"LO25.2", feedback:"Substitution and quality improvements can make CPI overstate cost-of-living increases." },
{ id:9116, difficulty:"legendaryBoss", conceptCluster:"growth_productivity", primarySkill:"rule_of_70", secondarySkills:["real_gdp_per_person"], repairSkill:"rule_of_70", commonError:"Forgetting that doubling time is approximately 70 divided by the growth rate.", q:"Boss Audit: Country A starts at $60,000 per person and grows at 2%. Country B starts at $30,000 and grows at 7%. Using Rule of 70, what is the best implication?", options:["B can reach A's starting level in about 10 years, while A takes about 35 years to double","B cannot catch up because it starts lower","A doubles faster than B","Both double in 20 years"], a:0, tag:"growth_differences", type:"multi-step", objective:"LO26.1", feedback:"B doubles in about 10 years; A doubles in about 35 years." },
{ id:9117, difficulty:"legendaryBoss", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"Boss Audit: Real GDP rises 4%, population rises 1.5%, and output per worker rises 2%. What is approximate real GDP per person growth?", options:["About 2.5%","About 5.5%","About 2%","About 4%"], a:0, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"Real GDP per person growth is roughly real GDP growth minus population growth: 4 - 1.5 = 2.5%." },
{ id:9118, difficulty:"legendaryBoss", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Boss Audit: Output rises from 200,000 to 260,000 while labor hours rise from 20,000 to 25,000. What happens to productivity?", options:["It rises from 10 to 10.4 units per hour","It falls from 10.4 to 10","It stays at 10","It rises from 8 to 10"], a:0, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"Initial productivity = 10. New productivity = 260,000/25,000 = 10.4." },
{ id:9119, difficulty:"legendaryBoss", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"Boss Audit: A country improves schools but has no reliable electricity, roads, or legal protection for investors. What limits growth?", options:["Human capital gains need complementary physical capital, infrastructure, and institutions","Education never affects growth","Only natural resources matter","Legal institutions matter only for unemployment"], a:0, tag:"productivity_factors", type:"integration", objective:"LO26.3", feedback:"Productivity depends on complementary factors, not education alone." },
{ id:9120, difficulty:"legendaryBoss", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Boss Audit: Capital per worker doubles, but output per worker rises only 20%. What concept is most directly shown?", options:["Diminishing returns to capital","Rule of 70","CPI substitution bias","Cyclical unemployment"], a:0, tag:"diminishing_returns", type:"interpretation", objective:"LO26.3", feedback:"Adding capital raises output, but less than proportionally, showing diminishing returns." },
{ id:9121, difficulty:"legendaryBoss", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Boss Audit: A poor country with little capital receives basic machinery and output rises sharply. A rich country adds similar machinery and output barely changes. Why?", options:["Capital has higher marginal product where it is scarce, consistent with catch-up logic","Rich countries cannot use machinery","Poor countries do not need human capital","GDP ignores machinery"], a:0, tag:"catch_up_growth", type:"interpretation", objective:"LO26.3", feedback:"The catch-up effect reflects high returns to capital where capital is scarce." },
{ id:9122, difficulty:"legendaryBoss", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Boss Audit: A government wants sustained growth. Which combination is strongest?", options:["Stable property rights, investment, education, trade openness, infrastructure, and R&D","Price controls, weak courts, and blocked technology","Transfers only, with no investment or training","Higher population growth with no capital deepening"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Sustained productivity growth requires institutions, capital, human capital, technology, and openness." },
{ id:9123, difficulty:"legendaryBoss", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Boss Audit: A country saves more, but political instability causes investors to hold funds abroad instead of building domestic capital. What went wrong?", options:["Saving did not translate into domestic investment because institutions were weak","Saving always guarantees domestic capital accumulation","Political instability raises productivity","Capital flight increases GDP by definition"], a:0, tag:"growth_policy", type:"integration", objective:"LO26.4", feedback:"Saving supports growth only when institutions allow savings to become productive investment." },
{ id:9124, difficulty:"legendaryBoss", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"Boss Audit: Employed = 150M, unemployed = 12M, not in labor force = 88M. Then 4M unemployed find jobs, and 6M leave the labor force. What is the new unemployment rate?", options:["1.28%","4.94%","3.70%","7.41%"], a:0, tag:"labor_force_stats", type:"multi-step", objective:"LO29.1", feedback:"New employed = 154M, unemployed = 2M, labor force = 156M. Unemployment = 2/156 = 1.28%. No listed answer is exact; this is a trap." },
{ id:9125, difficulty:"legendaryBoss", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"Boss Audit: Adult population is 320M, participation is 62.5%, and unemployment is 5%. How many are employed?", options:["190M","200M","16M","304M"], a:0, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Labor force = 0.625 x 320 = 200M. Unemployed = 10M. Employed = 190M." },
{ id:9126, difficulty:"legendaryBoss", conceptCluster:"labor_market", primarySkill:"discouraged_workers", secondarySkills:["employment_classification"], repairSkill:"discouraged_workers", commonError:"Counting discouraged workers as unemployed even after they stop actively searching.", q:"Boss Audit: A discouraged worker starts searching again but does not find work. What happens immediately?", options:["Labor force and measured unemployment both rise","Employment rises and unemployment falls","Labor force falls","The worker becomes employed"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"A discouraged worker who resumes active search is counted as unemployed and reenters the labor force." },
{ id:9127, difficulty:"legendaryBoss", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"Boss Audit: A worker laid off during a recession later finds their industry permanently replaced by automation. How should the unemployment be understood?", options:["Initially cyclical, then potentially structural","Always frictional","Never counted as unemployment","Only natural if the worker stops searching"], a:0, tag:"unemployment_types", type:"integration", objective:"LO29.3", feedback:"The cause can shift from weak demand to long-term mismatch." },
{ id:9128, difficulty:"legendaryBoss", conceptCluster:"labor_market", primarySkill:"minimum_wage_surplus", secondarySkills:["unions_efficiency_wages"], repairSkill:"minimum_wage_surplus", commonError:"Forgetting that a binding wage floor creates a surplus when labor supplied exceeds labor demanded.", q:"Boss Audit: A minimum wage creates quantity supplied of labor = 180 and quantity demanded = 125. What is the unemployment created by the surplus?", options:["55","125","180","305"], a:0, tag:"labor_market_policy", type:"calculation", objective:"LO29.4", feedback:"Labor surplus = 180 - 125 = 55." },
{ id:9129, difficulty:"legendaryBoss", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"Boss Audit: Unemployment insurance rises in generosity while job-search assistance also improves. What is the best prediction?", options:["The net effect on frictional unemployment is ambiguous because incentives and matching efficiency move in opposite directions","Frictional unemployment must rise","Frictional unemployment must fall","Only cyclical unemployment changes"], a:0, tag:"labor_market_policy", type:"integration", objective:"LO29.4", feedback:"More generous benefits may lengthen search, while better matching may shorten it." },
{ id:9130, difficulty:"legendaryBoss", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"Boss Audit: Actual unemployment is 7.8%, natural unemployment is 4.6%. What is cyclical unemployment?", options:["3.2 percentage points","4.6 percentage points","7.8 percentage points","12.4 percentage points"], a:0, tag:"natural_unemployment", type:"calculation", objective:"LO29.5", feedback:"Cyclical unemployment = actual unemployment - natural unemployment = 7.8 - 4.6 = 3.2 percentage points." },
{ id:9131, difficulty:"legendaryBoss", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"Boss Audit: The economy is expanding, but unemployment remains because workers are switching jobs and some skills no longer match available openings. What explains this?", options:["The natural rate remains due to frictional and structural unemployment","Cyclical unemployment must be rising","The unemployment rate must be zero in expansions","Discouraged workers are always employed"], a:0, tag:"natural_unemployment", type:"interpretation", objective:"LO29.5", feedback:"Even in expansions, search and mismatch keep the natural rate positive." },
{ id:9132, difficulty:"legendaryBoss", conceptCluster:"macro_integration", primarySkill:"integrated_macro_review", secondarySkills:["inflation_adjustment", "labor_force_calculation", "nominal_vs_real_gdp"], repairSkill:"integrated_macro_review", commonError:"Failing to connect inflation, real values, GDP measurement, and labor-market classification at the same time.", q:"Final Ledger Boss: Nominal wages rise 6%, CPI rises 8%, unemployment falls because many jobless workers stop searching, and real GDP rises slower than nominal GDP. Which combined interpretation is strongest?", options:["Real wages fell, unemployment data may overstate improvement, and some nominal GDP growth reflects inflation","Real wages rose, unemployment definitely improved, and all GDP growth was real","CPI is irrelevant to wages, and unemployment falling always means more jobs","Nominal GDP below real GDP means deflation"], a:0, tag:"macro_integration", type:"integration", objective:"integrated_macro_review", feedback:"This combines inflation adjustment, labor-force classification, and nominal versus real GDP interpretation. Brutal, but fair." }
],

easyBoss: [
// Set 1: GDP as income and expenditure
{ id:2000, difficulty:"easyBoss", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"The Registrar opens the ledger and asks: why can GDP be measured as both total income and total expenditure?", options:["Because every dollar spent by a buyer becomes income for a seller","Because income is always higher than spending","Because exports are never counted","Because prices do not affect GDP"], a:0, tag:"gdp_income_expenditure", type:"definition", objective:"LO24.1", boss:"Registrar", feedback:"GDP can be measured either way because one person's spending becomes another person's income." },
{ id:2001, difficulty:"easyBoss", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"A household spends $500 at a local repair shop. In the income-expenditure flow, what happens to the repair shop?", options:["It receives $500 in income","It loses $500 in income","Its income is unchanged","Only government income changes"], a:0, tag:"gdp_income_expenditure", type:"interpretation", objective:"LO24.1", boss:"Registrar", feedback:"The household's expenditure becomes income for the repair shop." },
{ id:2002, difficulty:"easyBoss", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"If total expenditure on final goods and services is $18 trillion, what should total income equal in the basic GDP identity?", options:["$18 trillion","$9 trillion","$36 trillion","It cannot be compared"], a:0, tag:"gdp_income_expenditure", type:"calculation", objective:"LO24.1", boss:"Registrar", feedback:"Total income equals total expenditure, so both are $18 trillion." },

// Set 2: What counts in GDP
{ id:2003, difficulty:"easyBoss", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"The Registrar asks which item belongs in GDP. Which one counts?", options:["A newly produced washing machine sold to a household","A used washing machine resold online","A stock purchase","A gift from one household to another"], a:0, tag:"gdp_definition", type:"definition", objective:"LO24.2", boss:"Registrar", feedback:"GDP counts newly produced final goods and services." },
{ id:2004, difficulty:"easyBoss", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"Why is a used car sale usually not counted in current GDP?", options:["The car was counted when it was first produced","Cars are never counted in GDP","Only government purchases count","Used goods are counted twice"], a:0, tag:"gdp_definition", type:"interpretation", objective:"LO24.2", boss:"Registrar", feedback:"Used goods are not current production, so they are not counted again." },
{ id:2005, difficulty:"easyBoss", conceptCluster:"gdp_measurement", primarySkill:"intermediate_vs_final_goods", secondarySkills:["gdp_counting_rules"], repairSkill:"intermediate_vs_final_goods", commonError:"Double-counting intermediate goods instead of counting final value or value added.", q:"A bakery buys flour for $40 and sells bread to consumers for $100. How much is counted in GDP from the final bread sale?", options:["$100","$40","$140","$60"], a:0, tag:"gdp_definition", type:"calculation", objective:"LO24.2", boss:"Registrar", feedback:"GDP counts the value of the final good, which is the $100 bread sale." },

// Set 3: GDP components
{ id:2006, difficulty:"easyBoss", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"The Registrar points to the spending ledger. Which formula correctly gives GDP?", options:["Y = C + I + G + NX","Y = C - I + G - NX","Y = wages + CPI + imports","Y = inflation + unemployment"], a:0, tag:"gdp_components", type:"definition", objective:"LO24.3", boss:"Registrar", feedback:"GDP expenditure equals consumption plus investment plus government purchases plus net exports." },
{ id:2007, difficulty:"easyBoss", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A firm buys a new machine to produce more goods. Which GDP component does this enter?", options:["Investment","Consumption","Government purchases","Net exports"], a:0, tag:"gdp_components", type:"interpretation", objective:"LO24.3", boss:"Registrar", feedback:"Business purchases of new capital goods are investment." },
{ id:2008, difficulty:"easyBoss", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"If C = 8, I = 2, G = 3, and NX = -1, what is GDP?", options:["12","14","10","8"], a:0, tag:"gdp_components", type:"calculation", objective:"LO24.3", boss:"Registrar", feedback:"GDP = 8 + 2 + 3 - 1 = 12." },

// Set 4: Imports, exports, and net exports
{ id:2009, difficulty:"easyBoss", conceptCluster:"gdp_components", primarySkill:"imports_exports_nx", secondarySkills:["gdp_components_identity"], repairSkill:"imports_exports_nx", commonError:"Adding imports instead of subtracting them through net exports.", q:"The Registrar asks how net exports are calculated:", options:["Exports minus imports","Imports minus exports","Consumption minus imports","Investment plus exports"], a:0, tag:"gdp_components", type:"definition", objective:"LO24.3", boss:"Registrar", feedback:"Net exports equal exports minus imports." },
{ id:2010, difficulty:"easyBoss", conceptCluster:"gdp_components", primarySkill:"imports_exports_nx", secondarySkills:["gdp_components_identity"], repairSkill:"imports_exports_nx", commonError:"Adding imports instead of subtracting them through net exports.", q:"A U.S. household buys an imported phone. What happens inside the GDP formula?", options:["Consumption rises and net exports fall","Investment rises and consumption falls","Government purchases rise","GDP automatically rises by the phone price"], a:0, tag:"gdp_components", type:"interpretation", objective:"LO24.3", boss:"Registrar", feedback:"Imported consumer goods raise consumption but lower net exports, so domestic GDP does not rise from foreign production." },
{ id:2011, difficulty:"easyBoss", conceptCluster:"gdp_components", primarySkill:"imports_exports_nx", secondarySkills:["gdp_components_identity"], repairSkill:"imports_exports_nx", commonError:"Adding imports instead of subtracting them through net exports.", q:"If exports are $600 billion and imports are $750 billion, what are net exports?", options:["-$150 billion","$150 billion","$1.35 trillion","-$1.35 trillion"], a:0, tag:"gdp_components", type:"calculation", objective:"LO24.3", boss:"Registrar", feedback:"Net exports = 600 - 750 = -150 billion." },

// Set 5: Nominal GDP, real GDP, and the GDP deflator
{ id:2012, difficulty:"easyBoss", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"The Registrar asks nominal GDP uses which prices?", options:["Current-year prices","Base-year prices","Only import prices","Only wage prices"], a:0, tag:"real_nominal_gdp", type:"definition", objective:"LO24.4", boss:"Registrar", feedback:"Nominal GDP values output using current-year prices." },
{ id:2013, difficulty:"easyBoss", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"Real GDP is useful because it:", options:["Removes the effect of price changes by using base-year prices","Counts used goods twice","Ignores output changes","Measures only imports"], a:0, tag:"real_nominal_gdp", type:"interpretation", objective:"LO24.4", boss:"Registrar", feedback:"Real GDP helps isolate changes in actual production." },
{ id:2014, difficulty:"easyBoss", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"An economy produces 10 units. The base-year price is $5 and the current price is $8. What is real GDP using base-year prices?", options:["$50","$80","$13","$30"], a:0, tag:"real_nominal_gdp", type:"calculation", objective:"LO24.4", boss:"Registrar", feedback:"Real GDP = 10 x $5 = $50." },

// Set 6: GDP and well-being
{ id:2015, difficulty:"easyBoss", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"The Registrar posits that GDP is useful as a measure of well-being mainly because:", options:["People generally prefer higher income and more goods and services","It perfectly measures happiness","It counts leisure directly","It measures pollution directly"], a:0, tag:"gdp_wellbeing", type:"definition", objective:"LO24.5", boss:"Registrar", feedback:"GDP is useful because income and production matter, but it is not perfect." },
{ id:2016, difficulty:"easyBoss", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"Why might GDP rise while well-being does not clearly improve?", options:["GDP can miss pollution, leisure, inequality, or other quality-of-life factors","GDP never counts production","GDP excludes all services","GDP only counts imports"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", boss:"Registrar", feedback:"GDP misses some important parts of well-being." },
{ id:2017, difficulty:"easyBoss", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"A country produces more output by making people work longer hours with less leisure. What limitation of GDP does this show?", options:["GDP does not fully account for lost leisure","GDP cannot count goods","GDP only counts leisure","GDP ignores all income"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", boss:"Registrar", feedback:"GDP counts the extra production but does not fully subtract the loss of leisure." },

{ id:2018, difficulty:"easyBoss", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"The Registrar turns to the price ledger. What does the CPI measure?", options:["The cost of a fixed basket of consumer goods and services over time","The number of people unemployed","The value of exports","The amount of government debt"], a:0, tag:"cpi_inflation", type:"definition", objective:"LO25.1", boss:"Registrar", feedback:"The CPI measures the cost of a fixed basket of consumer goods and services." },
{ id:2019, difficulty:"easyBoss", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"If the CPI rises, what does that usually indicate?", options:["Consumer prices have increased on average","Real GDP must have increased","Unemployment must have fallen","Imports must equal exports"], a:0, tag:"cpi_inflation", type:"interpretation", objective:"LO25.1", boss:"Registrar", feedback:"A rising CPI means the average cost of the consumer basket has increased." },
{ id:2020, difficulty:"easyBoss", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"If the CPI rises from 100 to 112, what is the inflation rate?", options:["12%","8%","112%","1.12%"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", boss:"Registrar", feedback:"Inflation = (112 - 100)/100 x 100 = 12%." },

{ id:2021, difficulty:"easyBoss", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"Answer the Registrar's query: To calculate CPI, economists compare:", options:["The current cost of a fixed basket to its base-year cost","The labor force to adult population","Exports to imports only","Nominal interest to real interest only"], a:0, tag:"cpi_inflation", type:"definition", objective:"LO25.1", boss:"Registrar", feedback:"CPI compares the current basket cost to the base-year basket cost." },
{ id:2022, difficulty:"easyBoss", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"A basket costs $200 in the base year and $250 today. What does that tell us before calculating the CPI?", options:["The basket is more expensive today","The basket is cheaper today","Real GDP fell","Unemployment rose"], a:0, tag:"cpi_inflation", type:"interpretation", objective:"LO25.1", boss:"Registrar", feedback:"The fixed basket costs more today than in the base year." },
{ id:2023, difficulty:"easyBoss", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"A basket costs $200 in the base year and $250 today. What is the CPI today?", options:["125","80","250","50"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", boss:"Registrar", feedback:"CPI = 100 x 250/200 = 125." },

// Set 9: CPI bias and cost of living
{ id:2024, difficulty:"easyBoss", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"The Registrar begins, one reason CPI can overstate the cost of living is:", options:["It may miss substitution toward cheaper goods","It ignores all consumer prices","It counts only exports","It measures unemployment instead of prices"], a:0, tag:"cpi_bias", type:"definition", objective:"LO25.2", boss:"Registrar", feedback:"The fixed basket can miss how consumers substitute toward relatively cheaper goods." },
{ id:2025, difficulty:"easyBoss", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"Beef becomes expensive, so households buy more chicken instead. Which CPI problem does this illustrate?", options:["Substitution bias","Cyclical unemployment","Net export bias","GDP double counting"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", boss:"Registrar", feedback:"Substitution bias occurs when consumers switch toward relatively cheaper goods." },
{ id:2026, difficulty:"easyBoss", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"A product becomes more expensive but also much higher quality. Why can that make CPI inflation misleading?", options:["Some of the price increase reflects quality improvement, not just inflation","Quality changes are always counted perfectly","The product becomes an import automatically","The CPI stops measuring it"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", boss:"Registrar", feedback:"If quality improves, a higher price may overstate the true rise in cost of living." },

// Set 10: CPI versus GDP deflator
{ id:2027, difficulty:"easyBoss", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"The Registrar asks, which price index uses a fixed basket of consumer goods and services?", options:["CPI","GDP deflator","Unemployment rate","Labor force participation rate"], a:0, tag:"cpi_vs_deflator", type:"definition", objective:"LO25.3", boss:"Registrar", feedback:"The CPI uses a fixed basket of consumer goods and services." },
{ id:2028, difficulty:"easyBoss", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"An imported coffee price rises. Which index is affected more directly?", options:["CPI","GDP deflator","Unemployment rate","Real GDP per worker"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", boss:"Registrar", feedback:"Imported consumer goods affect the CPI but are excluded from the GDP deflator." },
{ id:2029, difficulty:"easyBoss", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Which statement correctly compares CPI and the GDP deflator?", options:["CPI tracks a fixed consumer basket; the GDP deflator tracks prices of current domestic production","CPI tracks only exports; the GDP deflator tracks only imports","They are exactly identical","The GDP deflator measures unemployment"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", boss:"Registrar", feedback:"The CPI and GDP deflator both measure prices, but they use different baskets." },
