{ id:137, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"If the nominal interest rate is 7% and the inflation rate is 9%, the real interest rate is approximately:", options:["16%","7%","2%","-2%"], a:3, tag:"interest_inflation", type:"calculation", objective:"LO25.5", feedback:"Real interest rate = nominal interest rate - inflation rate = 7% - 9% = -2%." },
{ id:138, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"A bank pays 6% interest and inflation is 2%. What happened to purchasing power in the account?", options:["It rose by about 4%","It fell by about 4%","It rose by 8%","It was unchanged"], a:0, tag:"interest_inflation", type:"interpretation", objective:"LO25.5", feedback:"The real interest rate is about 4%, so purchasing power rises by about 4%." },
{ id:139, difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"Which borrower benefits most from unexpectedly high inflation?", options:["A borrower with a fixed nominal interest rate","A lender with a fixed nominal interest rate","A saver earning a low fixed rate","A worker paid only in real wages"], a:0, tag:"interest_inflation", type:"interpretation", objective:"LO25.5", feedback:"Unexpected inflation reduces the real burden of fixed nominal debt." },

{ id:140, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"Country A grows at 1% per year and Country B grows at 4% per year. What is the most likely long-run result?", options:["The income gap can become much larger over time because growth compounds","Both countries must end with the same income","Country A must always become richer","Growth rates do not affect living standards"], a:0, tag:"growth_differences", type:"interpretation", objective:"LO26.1", feedback:"Small growth-rate differences compound into large long-run income differences." },
{ id:141, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"rule_of_70", secondarySkills:["real_gdp_per_person"], repairSkill:"rule_of_70", commonError:"Forgetting that doubling time is approximately 70 divided by the growth rate.", q:"Using the Rule of 70, a country growing at 5% per year doubles its income in about:", options:["7 years","14 years","35 years","70 years"], a:1, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"70 divided by 5 equals about 14 years." },
{ id:142, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"rule_of_70", secondarySkills:["real_gdp_per_person"], repairSkill:"rule_of_70", commonError:"Forgetting that doubling time is approximately 70 divided by the growth rate.", q:"Using the Rule of 70, a country growing at 1% per year doubles its income in about:", options:["1 year","10 years","35 years","70 years"], a:3, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"70 divided by 1 equals about 70 years." },
{ id:143, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"Why can a country that is poor today become much richer over several decades?", options:["Sustained productivity growth can raise real GDP per person","Poor countries cannot grow","Only inflation can increase income","Unemployment must disappear first"], a:0, tag:"growth_differences", type:"interpretation", objective:"LO26.1", feedback:"Long-run growth in productivity can dramatically raise living standards." },
{ id:144, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"Which comparison best captures differences in living standards across countries?", options:["Real GDP per person","Nominal interest rates only","The number of banks","The unemployment rate alone"], a:0, tag:"growth_differences", type:"definition", objective:"LO26.1", feedback:"Real GDP per person is commonly used to compare living standards." },
{ id:145, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"If a firm produces 2,400 units with 300 labor hours, productivity is:", options:["4 units per hour","8 units per hour","300 units per hour","2,400 units per hour"], a:1, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"Productivity = output/labor hours = 2400/300 = 8 units per hour." },
{ id:146, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"If productivity rises from 20 units per worker to 25 units per worker, what is the percentage increase?", options:["5%","20%","25%","50%"], a:2, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"The increase is 5 on a base of 20, so productivity rises by 25%." },
{ id:147, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A country wants to raise living standards. Why is raising productivity more important than simply working more hours forever?", options:["Higher productivity increases output per worker and supports higher income per person","More hours always reduce GDP","Productivity only matters for inflation","Working hours are the same as net exports"], a:0, tag:"productivity", type:"interpretation", objective:"LO26.2", feedback:"Sustained living-standard gains come from producing more output per worker." },
{ id:148, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"If two countries have the same number of workers but one produces twice as much output, the key difference is likely:", options:["Higher productivity","Lower CPI only","Higher unemployment only","Equal physical capital"], a:0, tag:"productivity", type:"interpretation", objective:"LO26.2", feedback:"More output with the same labor means higher productivity." },
{ id:149, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A new irrigation system allows farmers to grow more crops with the same labor. Which productivity factor improved most directly?", options:["Technological knowledge or physical capital","Cyclical unemployment","CPI basket composition","Transfer payments"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"Better production methods and equipment raise productivity." },
{ id:150, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"human_capital", secondarySkills:["productivity_calculation"], repairSkill:"human_capital", commonError:"Confusing worker training and skills with physical equipment.", q:"A nation invests heavily in worker training and apprenticeship programs. Which factor of productivity is most directly increased?", options:["Natural resources","Human capital","Inflation","Net exports"], a:1, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"Training and education increase human capital." },
{ id:151, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"natural_resources", secondarySkills:["productivity_calculation"], repairSkill:"natural_resources", commonError:"Assuming natural resources alone guarantee high productivity.", q:"A country discovers large deposits of rare minerals used in manufacturing. Which productivity factor increased?", options:["Human capital","Natural resources","CPI quality adjustment","Frictional unemployment"], a:1, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"Mineral deposits are natural resources." },
{ id:152, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A factory adds more machines for each worker. What should happen to output per worker, other things equal?", options:["It should generally rise","It must fall to zero","It is unrelated to productivity","It only changes the CPI"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"More physical capital per worker generally raises productivity." },
{ id:153, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"technological_knowledge", secondarySkills:["productivity_calculation"], repairSkill:"technological_knowledge", commonError:"Confusing better production methods with more labor or more machines.", q:"Which example best illustrates technological knowledge?", options:["A new production process that uses fewer inputs per unit of output","More workers searching for jobs","A higher CPI for imported goods","A larger unemployment insurance payment"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"Technological knowledge means knowing better ways to produce." },
{ id:154, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Diminishing returns imply that if a country keeps adding capital while labor stays fixed:", options:["Each additional unit of capital eventually adds smaller increases in output","Each additional unit of capital adds larger increases forever","Output must immediately fall","Capital stops being counted in GDP"], a:0, tag:"diminishing_returns", type:"interpretation", objective:"LO26.3", feedback:"Diminishing returns means extra capital becomes less productive as more of it is added." },
{ id:155, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Why might poorer countries experience faster growth than richer countries, other things equal?", options:["The catch-up effect means added capital may have higher returns where capital is scarce","Poor countries cannot use capital","Rich countries always grow faster","Inflation forces poor countries to grow"], a:0, tag:"catch_up_growth", type:"interpretation", objective:"LO26.3", feedback:"The catch-up effect occurs because capital may be especially productive where it is scarce." },
{ id:156, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Which policy would most likely reduce long-run growth?", options:["Weakening property rights so investors fear losing assets","Improving education","Encouraging saving","Supporting research and development"], a:0, tag:"growth_policy", type:"trap", objective:"LO26.4", feedback:"Weak property rights discourage investment and reduce growth potential." },
{ id:157, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Why can free trade support productivity growth?", options:["It can allow specialization, access to larger markets, and access to better inputs or technology","It guarantees no workers will lose jobs","It makes inflation impossible","It replaces all investment"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Trade can raise productivity by improving specialization, competition, and access to inputs or ideas." },
{ id:158, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"A government wants to raise productivity over time. Which policy bundle makes the most sense?", options:["Education, stable property rights, investment incentives, and research support","Higher uncertainty, weaker courts, and lower investment","Banning technology and reducing training","Discouraging saving and closing schools"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Growth-friendly policies support human capital, capital formation, innovation, and stable institutions." },
{ id:159, difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Why can encouraging saving increase future productivity?", options:["Saving can finance investment in capital goods","Saving directly lowers the unemployment rate to zero","Saving makes the CPI fixed basket disappear","Saving prevents all recessions"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Saving helps provide funds for investment, which can increase capital and productivity." },

{ id:160, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"labor_force_calculation", secondarySkills:["unemployment_rate", "labor_force_participation"], repairSkill:"labor_force_calculation", commonError:"Forgetting that the labor force includes employed plus unemployed workers.", q:"An economy has 140 million employed people, 10 million unemployed people, and 50 million people not in the labor force. What is the labor force?", options:["140 million","150 million","190 million","200 million"], a:1, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Labor force = employed + unemployed = 140 + 10 = 150 million." },
{ id:161, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"Using 140 million employed and 10 million unemployed, what is the unemployment rate?", options:["5.0%","6.7%","7.1%","10.0%"], a:1, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Unemployment rate = 10 / 150 x 100 = 6.7%." },
{ id:162, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"If the labor force is 150 million and the adult population is 200 million, what is the labor force participation rate?", options:["50%","66.7%","75%","150%"], a:2, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Labor force participation = 150 / 200 x 100 = 75%." },
{ id:163, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"If 2 million unemployed workers become discouraged and stop looking for work, what happens immediately to the measured unemployment rate?", options:["It rises because discouraged workers become unemployed","It falls because they leave the labor force","It is unchanged because employment rises","It becomes 100%"], a:1, tag:"labor_force_stats", type:"interpretation", objective:"LO29.1", feedback:"Discouraged workers leave the labor force, which can lower the measured unemployment rate." },
{ id:164, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"An economy has 90 employed, 10 unemployed, and 50 not in the labor force. If 5 unemployed workers stop looking, what is the new unemployment rate?", options:["5.3%","10%","15%","50%"], a:0, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"New unemployed = 5 and new labor force = 95, so unemployment = 5/95 = 5.3%." },
{ id:165, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A parent who stays home full-time and is not seeking paid work is classified as:", options:["Employed","Unemployed","Not in the labor force","Structurally unemployed"], a:2, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Someone not working and not looking for paid work is not in the labor force." },
{ id:166, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A person works one hour for pay during the survey week while looking for full-time work. How is the person classified?", options:["Unemployed","Employed","Not in the labor force","Discouraged worker"], a:1, tag:"employment_categories", type:"trap", objective:"LO29.2", feedback:"A person who does any paid work during the survey period is counted as employed." },
{ id:167, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A worker without a job sends out applications during the last four weeks. How is the worker classified?", options:["Employed","Unemployed","Not in the labor force","Retired"], a:1, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Actively looking for work while jobless means the person is unemployed." },
{ id:168, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"discouraged_workers", secondarySkills:["employment_classification"], repairSkill:"discouraged_workers", commonError:"Counting discouraged workers as unemployed even after they stop actively searching.", q:"A discouraged worker wants a job but stopped searching because they believe no jobs are available. How is this worker classified in official unemployment statistics?", options:["Employed","Unemployed","Not in the labor force","Part of investment"], a:2, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Discouraged workers are not in the labor force because they are not actively searching." },
{ id:169, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"Which classification is most likely to make the unemployment rate understate labor market weakness?", options:["Counting discouraged workers as not in the labor force","Counting active job seekers as unemployed","Counting paid workers as employed","Counting unemployed workers in the labor force"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Discouraged workers are excluded from unemployment, which can hide labor market weakness." },
{ id:170, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A college graduate takes two months to find a first job that matches their skills. This is most likely:", options:["Frictional unemployment","Structural unemployment","Cyclical unemployment","Not in the labor force"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"Job search while matching workers and firms is frictional unemployment." },
{ id:171, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A coal miner loses work because the economy shifts permanently toward other energy sources and the miner lacks transferable skills. This is:", options:["Frictional unemployment","Structural unemployment","Cyclical unemployment","Seasonal inflation"], a:1, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"A long-term mismatch between skills and available jobs is structural unemployment." },
{ id:172, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"cyclical_unemployment", secondarySkills:["natural_rate"], repairSkill:"cyclical_unemployment", commonError:"Confusing recession-driven unemployment with natural unemployment.", q:"A hotel lays off workers because a recession reduces travel demand. This is:", options:["Frictional unemployment","Structural unemployment","Cyclical unemployment","Natural unemployment only"], a:2, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"Layoffs from weak demand during a recession are cyclical unemployment." },
{ id:173, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"Which type of unemployment would still exist even when the economy is healthy?", options:["Frictional unemployment","Only cyclical unemployment","Only recession unemployment","No unemployment"], a:0, tag:"unemployment_types", type:"definition", objective:"LO29.3", feedback:"Frictional unemployment exists because workers and firms take time to match." },
{ id:174, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"Which statement correctly distinguishes structural from frictional unemployment?", options:["Structural unemployment reflects deeper skill or location mismatches, while frictional unemployment reflects normal job search","Frictional unemployment is always permanent, while structural unemployment lasts one day","Structural unemployment is caused only by inflation","They are the same thing"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"Structural unemployment is about mismatch; frictional unemployment is about normal search." },
{ id:175, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"minimum_wage_surplus", secondarySkills:["unions_efficiency_wages"], repairSkill:"minimum_wage_surplus", commonError:"Forgetting that a binding wage floor creates a surplus when labor supplied exceeds labor demanded.", q:"A binding minimum wage above equilibrium creates unemployment because:", options:["Quantity of labor supplied exceeds quantity of labor demanded","Quantity of labor demanded exceeds quantity supplied","All workers leave the labor force","Firms hire more low-skill workers"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"A wage floor above equilibrium creates a surplus of labor." },
{ id:176, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"How can unemployment insurance improve worker outcomes even if it lengthens unemployment spells?", options:["It gives workers income support and time to find better job matches","It eliminates structural mismatch immediately","It forces all firms to hire","It lowers the labor force to zero"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Unemployment insurance can support job seekers, but may also reduce urgency to accept a job quickly." },
{ id:177, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"A union negotiates wages above the competitive equilibrium. What is the likely effect in that labor market?", options:["More workers want jobs than firms want to hire","Firms hire every worker who wants a job","Labor demand shifts to infinity","The unemployment rate is impossible to calculate"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Above-equilibrium wages can create a surplus of labor in that market." },
{ id:178, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"Efficiency wage theory says firms may pay above-equilibrium wages because higher wages can:", options:["Improve worker effort, reduce turnover, or attract better workers","Guarantee zero unemployment","Eliminate all inflation","Make GDP equal CPI"], a:0, tag:"labor_market_policy", type:"definition", objective:"LO29.4", feedback:"Efficiency wages can make workers more productive or reduce costly turnover." },
{ id:179, difficulty:"medium", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"Why does the natural rate of unemployment remain positive in the long run?", options:["Normal job search and structural mismatches remain even when cyclical unemployment is absent","Every worker is always unemployed","Inflation forces GDP to fall","The CPI excludes discouraged workers"], a:0, tag:"natural_unemployment", type:"interpretation", objective:"LO29.5", feedback:"The natural rate includes frictional and structural unemployment that persist in normal times." }
],

hard: [
{ id:200, difficulty:"hard", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"A firm produces $600,000 of final output. It pays $350,000 in wages, $100,000 in rent, $50,000 in interest, and keeps $100,000 in profit. What does this example show about GDP measurement?", options:["Expenditure on output and income earned from production both equal $600,000","Only wages count in GDP, so GDP is $350,000","Profit is excluded from GDP, so GDP is $500,000","GDP cannot be measured from income"], a:0, tag:"gdp_income_expenditure", type:"multi-step", objective:"LO24.1", feedback:"The value of final output equals the income generated in producing it: wages, rent, interest, and profit all add to $600,000." },
{ id:201, difficulty:"hard", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"Suppose total spending on domestically produced final goods is $22 trillion. Firms pay $13 trillion in wages, $3 trillion in rent and interest, and $4 trillion in profit. What must account for the remaining $2 trillion if income and expenditure are to match?", options:["Other income categories such as taxes on production and depreciation-type accounting adjustments","Imports, because imports are always income","Used goods sales","Transfer payments directly counted in GDP"], a:0, tag:"gdp_income_expenditure", type:"multi-step", objective:"LO24.1", feedback:"GDP income accounting includes more than wages, rent, interest, and profit; the identity still requires total income generated by production to match expenditure." },
{ id:202, difficulty:"hard", conceptCluster:"gdp_measurement", primarySkill:"intermediate_vs_final_goods", secondarySkills:["gdp_counting_rules"], repairSkill:"intermediate_vs_final_goods", commonError:"Double-counting intermediate goods instead of counting final value or value added.", q:"Why would counting both the sale of flour to a bakery and the sale of bread to consumers overstate GDP?", options:["It would count the value of the flour once as an intermediate good and again inside the final bread price","It would exclude the baker's labor income","It would treat bread as an import","It would make income less than expenditure by definition"], a:0, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"Intermediate goods are already embodied in the final good, so counting both creates double counting." },
{ id:203, difficulty:"hard", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A U.S. company produces $2 million of software in Ireland and sells it to customers in Europe. How does this affect U.S. GDP?", options:["It does not count in U.S. GDP because the production occurred outside U.S. borders","It counts in U.S. GDP because the firm is U.S.-owned","It counts as U.S. government purchases","It counts only if the software is downloaded in the U.S."], a:0, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"GDP is based on production within a country's borders, not ownership of the firm." },
{ id:204, difficulty:"hard", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A Canadian company produces cars in Tennessee and sells them to U.S. households. How are those cars treated in U.S. GDP?", options:["They count because they were produced inside the United States","They do not count because the company is foreign-owned","They count only as imports","They count only as transfer payments"], a:0, tag:"gdp_definition", type:"interpretation", objective:"LO24.2", feedback:"GDP counts production within national borders, regardless of whether the producer is domestically or foreign owned." },
{ id:205, difficulty:"hard", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A firm buys steel for $80, adds labor and capital services, and sells a machine for $230 to another firm. If the machine is newly produced and used in production, how much does GDP increase?", options:["$230","$150","$80","$310"], a:0, tag:"gdp_definition", type:"calculation", objective:"LO24.2", feedback:"The newly produced machine is a final capital good, so its full market value of $230 is counted." },
{ id:206, difficulty:"hard", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A household pays $2,000 for illegal services and $2,000 for legal market services. Which statement best explains the GDP issue?", options:["The legal market service is counted, while illegal or hidden activity is often missed even if production occurred","Both are always fully counted because all services are visible","Neither counts because services are excluded from GDP","Only illegal activity counts because it is current production"], a:0, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"GDP aims to count market production, but illegal or hidden activity is often excluded or poorly measured." },
{ id:207, difficulty:"hard", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A restaurant buys $300 of ingredients and sells meals for $900. Customers leave $100 in tips for servers. Ignoring any other complications, what is the strongest GDP interpretation?", options:["The $900 meal sales count as final services, and tips are income for service labor but not a separate final good","GDP counts $1,300 because ingredients, meals, and tips all stack","GDP counts only $300 because ingredients are tangible","GDP excludes restaurant services"], a:0, tag:"gdp_definition", type:"multi-step", objective:"LO24.2", feedback:"The meal service is the final output. Tips are income connected to service labor, not a separate final product stacked on top." },
{ id:208, difficulty:"hard", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A household buys a newly built house for $300,000, a used car for $15,000, and $5,000 of groceries. What amount is added to GDP from these purchases?", options:["$305,000","$320,000","$20,000","$300,000"], a:0, tag:"gdp_components", type:"calculation", objective:"LO24.3", feedback:"The new house and groceries count. The used car resale does not add to current GDP, so GDP rises by $305,000." },
{ id:209, difficulty:"hard", conceptCluster:"gdp_components", primarySkill:"imports_exports_nx", secondarySkills:["gdp_components_identity"], repairSkill:"imports_exports_nx", commonError:"Adding imports instead of subtracting them through net exports.", q:"Suppose C = $14T, I = $4T, G = $5T, exports = $3T, and imports = $4.5T. What is GDP?", options:["$21.5T","$23T","$24.5T","$30.5T"], a:0, tag:"gdp_components", type:"calculation", objective:"LO24.3", feedback:"GDP = C + I + G + NX = 14 + 4 + 5 + (3 - 4.5) = 21.5." },
{ id:210, difficulty:"hard", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A government sends $1,000 unemployment checks to households, and households spend the full amount on groceries. What is the GDP effect?", options:["The transfer itself is not counted, but the grocery purchases count as consumption if they buy current final goods","Both the transfer and groceries count, so GDP rises by $2,000","Neither counts because government is involved","Only the transfer counts as government purchases"], a:0, tag:"gdp_components", type:"trap", objective:"LO24.3", feedback:"Transfer payments are not purchases of current goods and services, but later household spending can count as consumption." },
{ id:211, difficulty:"hard", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A U.S. household buys a $40,000 car produced in Germany. In U.S. GDP accounting, what happens?", options:["Consumption rises by $40,000 and net exports fall by $40,000, so U.S. GDP is unchanged","Consumption rises and GDP rises by $40,000","Investment rises and imports are ignored","Government purchases rise and GDP is unchanged"], a:0, tag:"gdp_components", type:"multi-step", objective:"LO24.3", feedback:"Imported consumer goods enter consumption but are subtracted through imports in net exports, so domestic GDP does not rise." },
{ id:212, difficulty:"hard", conceptCluster:"gdp_components", primarySkill:"inventory_investment", secondarySkills:["gdp_components_identity"], repairSkill:"inventory_investment", commonError:"Excluding unsold current production instead of counting it as inventory investment.", q:"A U.S. firm builds $100 million of equipment domestically and sells $70 million of it this year, keeping $30 million in inventory. What is counted in GDP?", options:["$100 million because unsold output is inventory investment","$70 million because only sold goods count","$30 million because only inventory counts","$0 because business equipment is excluded"], a:0, tag:"gdp_components", type:"calculation", objective:"LO24.3", feedback:"Current production counts whether sold or added to inventories, so all $100 million counts." },
{ id:213, difficulty:"hard", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"Nominal GDP rises from $20T to $22T while real GDP rises from $18T to $18.9T. What is the best interpretation?", options:["Both prices and real output likely rose","Only real output rose","Only prices rose","Neither prices nor output changed"], a:0, tag:"real_nominal_gdp", type:"interpretation", objective:"LO24.4", feedback:"Real GDP rose 5%, while nominal GDP rose 10%, so both output and prices likely increased." },
{ id:214, difficulty:"hard", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"If nominal GDP is $30T and real GDP is $25T, what is the GDP deflator?", options:["120","83.3","55","125"], a:0, tag:"real_nominal_gdp", type:"calculation", objective:"LO24.4", feedback:"GDP deflator = nominal GDP / real GDP x 100 = 30/25 x 100 = 120." },
{ id:215, difficulty:"hard", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"An economy produces 100 units at $5 in year 1 and 110 units at $6 in year 2. Using year 1 as the base year, what is year 2 real GDP?", options:["$550","$600","$660","$500"], a:0, tag:"real_nominal_gdp", type:"calculation", objective:"LO24.4", feedback:"Real GDP uses base-year prices, so year 2 real GDP = 110 x $5 = $550." },
{ id:216, difficulty:"hard", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"An economy produces only apples. Quantity rises from 1,000 to 1,100 and price rises from $2 to $3. What happens to nominal and real GDP using the first year as base?", options:["Nominal GDP rises by more than real GDP","Real GDP rises by more than nominal GDP","Nominal GDP falls while real GDP rises","Both are unchanged"], a:0, tag:"real_nominal_gdp", type:"multi-step", objective:"LO24.4", feedback:"Nominal GDP reflects both higher quantity and higher price, while real GDP only reflects higher quantity." },
{ id:217, difficulty:"hard", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"A country cuts pollution regulations, output rises, but air quality worsens and illness increases. What does this show about GDP?", options:["GDP may rise even when broader well-being does not clearly improve","GDP must fall when pollution rises","GDP fully captures health and environmental costs","GDP excludes all production by regulated firms"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"GDP counts production but does not fully capture environmental damage or health costs." },
{ id:218, difficulty:"hard", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"Which scenario best shows why GDP per person is more useful than total GDP for comparing living standards?", options:["A country's GDP doubles while its population triples","A country's exports rise faster than imports","A country sells more used cars","A country changes its CPI base year"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"If population grows faster than GDP, average income may fall even though total GDP rises." },
{ id:219, difficulty:"hard", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"Two countries have equal GDP per person, but one has more leisure, cleaner air, and lower crime. What is the strongest conclusion?", options:["GDP per person misses some important parts of well-being","The cleaner country must have lower real GDP","GDP perfectly ranks living standards","Crime and leisure are already fully included in GDP"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"GDP per person is useful but incomplete because it misses non-market quality-of-life factors." },

{ id:220, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"A CPI basket has 3 books and 2 meals. Base-year prices are $20 per book and $10 per meal. Current prices are $25 per book and $15 per meal. What is the current CPI?", options:["131.25","125","150","80"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Base cost = 3(20)+2(10)=80. Current cost = 3(25)+2(15)=105. CPI = 100 x 105/80 = 131.25." },
{ id:221, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"If the CPI rises from 125 to 155, what is the inflation rate?", options:["24%","30%","19.4%","55%"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Inflation = (155 - 125)/125 x 100 = 24%." },
{ id:222, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"A basket costs $900 in the base year, $1,080 last year, and $1,188 this year. What is this year's inflation rate?", options:["10%","18.8%","32%","8.8%"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Last year's CPI is 120 and this year's CPI is 132, so inflation is 10%." },
{ id:223, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"If the CPI is 250 today and was 200 five years ago, what is the total inflation over the period?", options:["25%","50%","20%","250%"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Inflation = (250 - 200)/200 x 100 = 25%." },
{ id:224, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"A fixed CPI basket shows inflation of 12%, but households avoided much of the increase by switching away from the goods with the largest price increases. What is the likely issue?", options:["The CPI may overstate the rise in the cost of living because of substitution bias","The CPI must understate inflation because substitution is illegal","The GDP deflator must be zero","The nominal interest rate must equal 12%"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"Substitution bias means consumers can reduce the actual cost increase by switching purchases, but the fixed basket may miss that." },
{ id:225, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"A phone price rises 20%, but the new model has twice the storage, better battery life, and better cameras. Why might measured inflation be overstated?", options:["Some of the price increase reflects quality improvement rather than a higher cost for the same product","All quality improvements are counted as unemployment","The phone is an intermediate good","The CPI excludes consumer electronics entirely"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"If quality improves, a price increase may exaggerate the true increase in the cost of living." },
{ id:226, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"Which CPI problem is most directly tied to the fact that consumers gain from products that did not exist in the base year?", options:["Introduction of new goods","Cyclical unemployment","Net export subtraction","Natural rate adjustment"], a:0, tag:"cpi_bias", type:"definition", objective:"LO25.2", feedback:"New goods can improve consumer welfare before the fixed CPI basket fully captures them." },
{ id:227, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"Suppose beef rises from $10 to $20 and chicken rises from $10 to $12. The CPI basket assumes consumers still buy equal amounts of beef and chicken, but consumers buy much more chicken. What is the main measurement problem?", options:["The fixed basket misses substitution toward chicken","The CPI ignores all food prices","The GDP deflator cannot measure domestic goods","The real interest rate becomes negative"], a:0, tag:"cpi_bias", type:"multi-step", objective:"LO25.2", feedback:"Consumers switch toward relatively cheaper chicken, so the fixed basket can overstate inflation." },
{ id:228, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"Which statement gives the best overall critique of the CPI?", options:["It is useful for measuring consumer price changes, but it can mismeasure cost of living because of substitution, new goods, and quality changes","It is useless because no prices are included","It perfectly measures welfare","It measures only business investment prices"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"The CPI is useful, but it is not a perfect cost-of-living measure." },
{ id:229, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Oil imported from abroad becomes more expensive and is heavily used by consumers. What happens to CPI and the GDP deflator, all else equal?", options:["CPI rises more directly because imports are in consumer purchases, while the GDP deflator excludes imported production","Both indexes ignore imported oil","The GDP deflator rises directly, but CPI cannot","Neither index can change"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"Imported consumer goods affect the CPI but are not part of domestic production measured by the GDP deflator." },
{ id:230, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"A domestically produced factory robot rises in price and is purchased by firms. Which index is more directly affected?", options:["GDP deflator","CPI","Unemployment rate","Labor force participation rate"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"Domestically produced capital goods are included in GDP and affect the GDP deflator." },
{ id:231, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Why does the GDP deflator not rely on a fixed basket in the same way as the CPI?", options:["It reflects the prices of currently produced goods and services, so the basket changes as production changes","It measures only one product","It ignores prices","It only includes imported goods"], a:0, tag:"cpi_vs_deflator", type:"definition", objective:"LO25.3", feedback:"The GDP deflator changes with the composition of current domestic production." },
{ id:232, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"If consumers buy more imported goods and fewer domestically produced goods, why might CPI and GDP deflator diverge?", options:["CPI includes imported consumer goods, while the GDP deflator focuses on domestic production","Both indexes are based only on labor force statistics","The GDP deflator includes imports twice","The CPI excludes all consumer purchases"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"Different coverage of imports can cause CPI and GDP deflator movements to differ." },
{ id:233, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A wage was $18,000 when the CPI was 90. The CPI is now 270. What is the wage in today's dollars?", options:["$54,000","$27,000","$6,000","$36,000"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"Today's dollars = 18000 x 270/90 = 54000." },
{ id:234, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A tuition bill was $4,000 when the CPI was 125. In today's dollars, it equals $6,400. What is today's CPI?", options:["200","160","250","80"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"6400 = 4000 x today's CPI/125, so today's CPI = 200." },
{ id:235, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A salary is $72,000 today when the CPI is 240. What was its equivalent value in year-T dollars when the CPI was 160?", options:["$48,000","$72,000","$108,000","$32,000"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"Year-T dollars = 72000 x 160/240 = 48000." },
{ id:236, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"If a lender charges 9% nominal interest and expected inflation is 4%, what real return does the lender expect?", options:["5%","13%","4%","-5%"], a:0, tag:"interest_inflation", type:"calculation", objective:"LO25.5", feedback:"Expected real interest rate = nominal rate - expected inflation = 9% - 4% = 5%." },
{ id:237, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"A borrower agrees to repay a loan at 6% nominal interest. Inflation unexpectedly rises from 2% to 8%. Who is helped, other things equal?", options:["The borrower, because the real repayment burden falls","The lender, because the real return rises","Neither side, because inflation does not affect real payments","Only the government, because GDP falls"], a:0, tag:"interest_inflation", type:"interpretation", objective:"LO25.5", feedback:"Unexpected inflation lowers the real value of fixed nominal repayments, helping borrowers." },
{ id:238, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"If nominal interest is 4% and inflation is 7%, what does the real interest rate imply?", options:["Purchasing power falls by about 3%","Purchasing power rises by about 11%","Purchasing power rises by 4%","Inflation is irrelevant"], a:0, tag:"interest_inflation", type:"interpretation", objective:"LO25.5", feedback:"Real interest = 4% - 7% = -3%, so purchasing power falls." },
{ id:239, difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"Which statement best explains why inflation matters for interest rates?", options:["The nominal rate shows dollar growth, while the real rate shows purchasing-power growth","The real rate ignores inflation","The nominal rate is always lower than inflation","Inflation only affects unemployment, not borrowing"], a:0, tag:"interest_inflation", type:"interpretation", objective:"LO25.5", feedback:"The real rate adjusts nominal interest for inflation to show changes in purchasing power." },

{ id:240, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"rule_of_70", secondarySkills:["real_gdp_per_person"], repairSkill:"rule_of_70", commonError:"Forgetting that doubling time is approximately 70 divided by the growth rate.", q:"Country A grows at 2% and Country B grows at 5%. Using the Rule of 70, how much sooner does Country B double its income?", options:["About 21 years sooner","About 3 years sooner","About 35 years sooner","About 70 years sooner"], a:0, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"Country A doubles in about 35 years; Country B doubles in about 14 years, so B doubles about 21 years sooner." },
{ id:241, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"A country with lower current income grows rapidly for several decades and catches up to richer countries. Which concept best explains this possibility?", options:["Sustained growth and the catch-up effect","CPI substitution bias","Cyclical unemployment","Transfer payment accounting"], a:0, tag:"growth_differences", type:"interpretation", objective:"LO26.1", feedback:"Growth compounds over time, and poorer countries may grow faster when capital is scarce." },
{ id:242, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"If real GDP per person rises from $20,000 to $26,000, what is the percentage increase?", options:["30%","23.1%","6%","130%"], a:0, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"Growth = (26000 - 20000)/20000 x 100 = 30%." },
{ id:243, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"Which country likely has the higher living standard, holding other quality-of-life factors aside?", options:["Country A with real GDP of $1T and population of 10M","Country B with real GDP of $2T and population of 80M","Country C with nominal GDP of $3T but unknown prices","Country D with higher inflation"], a:0, tag:"growth_differences", type:"multi-step", objective:"LO26.1", feedback:"Country A has real GDP per person of $100,000; Country B has $25,000." },
{ id:244, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"Why can rankings of countries by income change dramatically over time?", options:["Different growth rates compound over many years","Nominal GDP is always constant","Population never changes","The Rule of 70 prevents poor countries from growing"], a:0, tag:"growth_differences", type:"interpretation", objective:"LO26.1", feedback:"Long-run differences in growth rates can greatly change relative income levels." },
{ id:245, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A factory produces $900,000 of output using 30 workers. What is output per worker?", options:["$30,000","$300,000","$900,000","$27,000,000"], a:0, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"Productivity = output/workers = 900000/30 = 30000 per worker." },
{ id:246, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Output rises from 10,000 units to 12,000 units while labor rises from 100 workers to 150 workers. What happens to productivity?", options:["It falls from 100 units per worker to 80 units per worker","It rises from 100 units per worker to 120 units per worker","It stays at 100 units per worker","It cannot be calculated"], a:0, tag:"productivity", type:"multi-step", objective:"LO26.2", feedback:"Initial productivity is 100; new productivity is 12000/150 = 80, so productivity falls." },
{ id:247, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A country raises total output by adding more workers, but output per worker does not rise. What is the best conclusion?", options:["Total GDP may rise, but productivity and average living standards may not improve much","Real GDP per person must double","Productivity must rise because output rose","Inflation must fall"], a:0, tag:"productivity", type:"interpretation", objective:"LO26.2", feedback:"More workers can raise total output without raising output per worker." },
{ id:248, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Workers produce 500 units in 1,000 hours before training and 650 units in 1,000 hours after training. What happened?", options:["Productivity rose from 0.5 to 0.65 units per hour","Productivity fell from 2 to 1.54 units per hour","Productivity stayed constant","Output rose but productivity cannot change"], a:0, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"Productivity is output per hour: 500/1000 = 0.5 and 650/1000 = 0.65." },
{ id:249, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A country buys more machines, improves schools, and adopts better production software. Which productivity factors are increasing?", options:["Physical capital, human capital, and technological knowledge","Only natural resources","Only inflation adjustment","Only cyclical employment"], a:0, tag:"productivity_factors", type:"multi-step", objective:"LO26.3", feedback:"Machines raise physical capital, schools raise human capital, and software/process improvements reflect technological knowledge." },
{ id:250, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"Two countries have similar workers and technology, but one has far more equipment per worker. Which difference most directly explains higher productivity?", options:["More physical capital per worker","More discouraged workers","Higher CPI bias","Lower nominal interest"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"More equipment per worker generally raises output per worker." },
{ id:251, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A country with strong education but weak roads, ports, and electricity may still struggle with productivity because it lacks:", options:["Physical capital and infrastructure","Human capital","CPI measurement","Frictional unemployment"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"Infrastructure is part of the physical capital that helps workers produce efficiently." },
{ id:252, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"natural_resources", secondarySkills:["productivity_calculation"], repairSkill:"natural_resources", commonError:"Assuming natural resources alone guarantee high productivity.", q:"A new farming method raises output per acre without increasing land, labor, or machinery. Which factor is most directly responsible?", options:["Technological knowledge","Natural resources","Labor force participation","Inflation"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"A better method of production is technological knowledge." },
{ id:253, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"human_capital", secondarySkills:["productivity_calculation"], repairSkill:"human_capital", commonError:"Confusing worker training and skills with physical equipment.", q:"Which example best illustrates human capital rather than technological knowledge?", options:["Workers complete advanced training in machine repair","A firm invents a new production algorithm","A country discovers oil","A government measures inflation"], a:0, tag:"productivity_factors", type:"trap", objective:"LO26.3", feedback:"Training workers increases human capital; an invention or method itself is technological knowledge." },
{ id:254, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"human_capital", secondarySkills:["productivity_calculation"], repairSkill:"human_capital", commonError:"Confusing worker training and skills with physical equipment.", q:"Why does capital deepening eventually face limits if technology and human capital do not improve?", options:["Diminishing returns mean each extra machine adds less output when workers already have many machines","Capital is never useful","Natural resources become irrelevant","Output per worker must become zero"], a:0, tag:"diminishing_returns", type:"interpretation", objective:"LO26.3", feedback:"Diminishing returns limit the gains from adding more capital alone." },
{ id:255, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A poor country has little capital per worker. A new investment project adds basic equipment to farms and factories. Why might returns be high?", options:["Because capital is scarce, the marginal product of additional capital can be large","Because diminishing returns never exist in poor countries","Because inflation makes machines cheaper in real terms","Because GDP excludes capital"], a:0, tag:"catch_up_growth", type:"interpretation", objective:"LO26.3", feedback:"The catch-up effect comes from high returns to capital where capital is scarce." },
{ id:256, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Which policy mix is most likely to support sustained productivity growth rather than only a temporary boost?", options:["Education, investment, property rights, trade openness, and research support","One-time stimulus checks only","Price ceilings on all capital goods","Discouraging foreign investment and innovation"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Sustained growth comes from policies that improve capital, skills, innovation, and institutions." },
{ id:257, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Why might political instability reduce long-run growth?", options:["It discourages investment because firms and households fear future losses or rule changes","It automatically increases human capital","It guarantees higher saving","It makes diminishing returns disappear"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Investment is less likely when property rights and future rules are uncertain." },
{ id:258, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"A government restricts foreign direct investment to protect domestic firms. What is a possible long-run cost?", options:["Less access to capital, technology, and productivity improvements","Guaranteed faster catch-up growth","No effect on capital accumulation","Automatic increase in human capital"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Foreign investment can bring capital and technology, so restricting it may slow productivity growth." },
{ id:259, difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Why can research and development policies raise living standards even if they do not immediately raise output?", options:["They can increase technological knowledge, which raises future productivity","They directly count as discouraged workers","They lower GDP by definition","They only change the CPI basket"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"R&D can improve production methods and technologies that raise future output per worker." },

{ id:260, difficulty:"hard", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"An economy has 180 million employed, 12 million unemployed, and 68 million not in the labor force. What are the unemployment rate and labor force participation rate?", options:["6.25% unemployment and 73.85% participation","6.67% unemployment and 69.23% participation","4.62% unemployment and 73.85% participation","6.25% unemployment and 69.23% participation"], a:0, tag:"labor_force_stats", type:"multi-step", objective:"LO29.1", feedback:"Labor force = 192M; unemployment = 12/192 = 6.25%; adult population = 260M; participation = 192/260 = 73.85%." },
{ id:261, difficulty:"hard", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"An economy has 95 employed, 5 unemployed, and 50 not in the labor force. Ten people who were not in the labor force begin looking for work but do not find jobs. What is the new unemployment rate?", options:["13.6%","5%","10%","15%"], a:0, tag:"labor_force_stats", type:"multi-step", objective:"LO29.1", feedback:"Unemployed rises to 15 and labor force rises to 110, so unemployment = 15/110 = 13.6%." },
{ id:262, difficulty:"hard", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"An economy has 100 employed and 20 unemployed. Five unemployed workers find jobs, while five others stop looking. What happens to the unemployment rate?", options:["It falls because unemployment decreases and the labor force shrinks","It rises because employment rises","It stays unchanged because ten workers changed status","It becomes zero"], a:0, tag:"labor_force_stats", type:"multi-step", objective:"LO29.1", feedback:"Unemployed falls to 10 and labor force falls to 115, so the unemployment rate falls from 16.7% to about 8.7%." },
{ id:263, difficulty:"hard", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"If the unemployment rate falls because many jobless workers stop searching, what is the best interpretation?", options:["The labor market may not have improved even though measured unemployment fell","Employment must have increased strongly","Structural unemployment disappeared","GDP must have increased"], a:0, tag:"labor_force_stats", type:"interpretation", objective:"LO29.1", feedback:"A falling unemployment rate can be misleading if discouraged workers leave the labor force." },
{ id:264, difficulty:"hard", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"Adult population is 250 million, labor force participation is 64%, and unemployment is 8 million. How many people are employed?", options:["152 million","160 million","242 million","168 million"], a:0, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Labor force = 0.64 x 250 = 160 million. Employed = 160 - 8 = 152 million." },
{ id:265, difficulty:"hard", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A person has no job, wants work, is available, but has not searched in six weeks because they think no jobs exist. How is this person classified and why does it matter?", options:["Not in the labor force; this can make unemployment look lower than labor market weakness suggests","Unemployed; all jobless people are counted","Employed; wanting work is enough","Structurally employed; skills do not matter"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Without active search, discouraged workers are not counted as unemployed, which can understate weakness." },
{ id:266, difficulty:"hard", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A worker has a part-time job but wants full-time work. How is the worker officially classified?", options:["Employed, even though the situation may show underemployment","Unemployed because the worker wants more hours","Not in the labor force because the job is part time","Discouraged because the worker is dissatisfied"], a:0, tag:"employment_categories", type:"trap", objective:"LO29.2", feedback:"Part-time workers are counted as employed, even when they would prefer full-time work." },
{ id:267, difficulty:"hard", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"Which case creates the biggest problem for interpreting the official unemployment rate?", options:["A large increase in discouraged workers","A worker voluntarily switches jobs and searches for one week","A student works part time by choice","A retiree remains retired"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Discouraged workers are excluded from measured unemployment, hiding some labor market distress." },
{ id:268, difficulty:"hard", conceptCluster:"labor_market", primarySkill:"discouraged_workers", secondarySkills:["employment_classification"], repairSkill:"discouraged_workers", commonError:"Counting discouraged workers as unemployed even after they stop actively searching.", q:"A laid-off engineer searches actively for work in the same field. A retired teacher does not want work. A discouraged factory worker wants work but stopped searching. Who is counted as unemployed?", options:["Only the laid-off engineer","The engineer and retired teacher","The engineer and discouraged factory worker","All three"], a:0, tag:"employment_categories", type:"multi-step", objective:"LO29.2", feedback:"Only jobless people actively searching are counted as unemployed." },
{ id:269, difficulty:"hard", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"Why does the official unemployment rate miss some labor market pain?", options:["It excludes discouraged workers and does not distinguish full-time from involuntary part-time work","It counts all adults as unemployed","It includes no employed workers","It measures only inflation"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"The unemployment rate is useful but misses discouraged workers and underemployment." },
