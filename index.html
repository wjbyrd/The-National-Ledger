/* =========================================
   1. VISUAL DESIGN — THE NATIONAL LEDGER
========================================= */	
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    color: #f3ead2;
    background: url('question_background_image.png');
    background-size: cover;
    background-position: center;
}

/* Economic Realm overlay — civic, luminous, not noir */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,
            rgba(56,189,248,0.10),
            rgba(15,23,42,0.36) 48%,
            rgba(2,6,23,0.78) 100%);
    pointer-events:none;
    z-index:-1;
}
	
.dungeon-container {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 40px;
    width: 100%;
    max-width: 1100px;
    margin-top: 20px;
}

/* CENTER BLOCK */
.start-content{
    width: 100%;
    max-width: 460px;
    display:flex;
    flex-direction:column;
    align-items:center;   
    text-align:center;
    padding: 28px 30px;
    border-radius: 18px;  
}

/* TITLE — civic gold */	
.title{
  font-size:64px;
  letter-spacing:4px;
  margin-bottom:10px;
  color:#f4d58d;
  text-align:center;
  text-shadow:
    0 0 14px rgba(214,177,92,0.85),
    0 0 34px rgba(180,83,9,0.55),
    0 3px 8px rgba(0,0,0,0.9);
}

/* SUBTITLE — holographic blue */	
.subtitle{
  font-size:34px;
  margin-bottom:35px;
  letter-spacing:2px;
  text-align:center;
  color:#b98746;
  text-shadow:
    0 0 10px rgba(185,135,70,0.45),
    0 0 26px rgba(0,0,0,0.85),
	0 3px 8px rgba(0,0,0,0.92);  
}

/* TAGLINE */	
.tagline{
  margin-bottom:30px;
  font-style:italic;
  opacity:0.88;
  text-align:center;
  color:#d8c7a0;
   text-shadow:

/* =========================================
   2. CORE GAME CONTAINER (#gameBox) — SAFE TO STYLE
========================================= */

#gameBox {
    max-width: 750px;
    flex:1;
    min-width:0;
    width:100%;
    margin: 0;
    padding: 18px 20px;
    text-align: center;

    background:
        radial-gradient(circle at center,
            rgba(96,165,250,0.13) 0%,
            rgba(15,23,42,0.58) 46%,
            rgba(8,16,36,0.94) 74%,
            rgba(2,6,23,0.99) 100%);

    backdrop-filter: blur(6px);
    border-radius: 14px;
    box-sizing: border-box;

    box-shadow:
        0 0 22px rgba(96,165,250,0.18),
        0 0 58px rgba(247,217,130,0.10),
        0 0 72px rgba(15,23,42,0.72),
        inset 0 0 42px rgba(0,0,0,0.78);

    border: 1px solid rgba(247,217,130,0.34);
    animation: torchFlicker 6s infinite;
    transition: box-shadow .3s ease, border-color .3s ease;

}

/* Boss state styling — triggered during boss fights (DO NOT REMOVE) */
#gameBox.boss-mode {
    border: 2px solid #d6b15c;
    box-shadow:
        0 0 32px rgba(214,177,92,0.58),
        0 0 64px rgba(100,36,24,0.48),
        inset 0 0 42px rgba(0,0,0,0.78);
}

.boss-icon{
    width: 28px;
    height: 28px;
    object-fit: contain;
    pointer-events: none;
}

/* Tier 1 — Registrar of False Measures */
.boss10 .boss-icon{
    filter:
        drop-shadow(0 0 6px rgba(214,177,92,0.85))

/* Tier 2 — Warden of Labor Flows */

/* =========================================
   4. BUTTONS & INTERACTION — SAFE TO CUSTOMIZE
========================================= */

/* Base button styling — applies to all buttons */
button {
    padding: 12px 22px;
    margin: 6px;
    font-size: 16px;
    cursor: pointer;
    background: linear-gradient(180deg, #5b3a1f, #1b1711);

    box-shadow:

}

/* Hover feedback — improves interactivity */

    background: linear-gradient(180deg, #7a4a25, #2a1b12);
    border-color: rgba(240,199,94,0.7);
    box-shadow:
        0 0 18px rgba(240,199,94,0.48),
        0 0 34px rgba(127,29,29,0.28),
        inset 0 0 12px rgba(0,0,0,0.68);

/* Click feedback — simulates button press */
button:active {

}

.answers {

/* =========================================
   5. PROGRESS & MAZE TRACK — SAFE TO CUSTOMIZE (WITH RULES)
========================================= */
    
/* Progress bar container — background track */
#progressBar {
    width: 100%;
    height: 22px;
    background: linear-gradient(180deg,
        rgba(12,18,18,0.95),
        rgba(4,5,5,0.98));
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
    border: 1px solid rgba(214,177,92,0.22);
    box-shadow:
        inset 0 0 12px rgba(0,0,0,0.82),
        0 0 10px rgba(214,177,92,0.12);
}
    
/* Progress fill — width controlled by JS */
#progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,
        #2f4f43,
        #d6b15c,
        #8a3a24);
    box-shadow:
        0 0 12px rgba(214,177,92,0.45),
        0 0 22px rgba(127,29,29,0.25);
    transition: width 0.4s ease;
}

/* Maze grid layout — 10 columns = 30 total rooms */
#mazeTrack {
    display: grid;
    grid-template-columns: repeat(10, 36px);
    justify-content: center;
    gap: 10px;
    margin: 25px auto;
}
    
/* Individual room cell — default state */
.maze-box {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border-radius: 6px;
    background: linear-gradient(180deg,
        rgba(22,30,28,0.72),
        rgba(7,9,9,0.86));
    border: 1px solid rgba(214,177,92,0.18);
    box-shadow:
        inset 0 0 10px rgba(0,0,0,0.72),
        0 0 5px rgba(214,177,92,0.08);
    transition: all 0.3s ease;
}

/* Current room highlight — animated pulse */
.maze-box.active {
    background: radial-gradient(circle,
        rgba(214,177,92,0.48),
        rgba(65,95,78,0.36),
        rgba(12,18,18,0.92));
    border: 2px solid #f0c75e;
    box-shadow:
        0 0 12px rgba(240,199,94,0.78),
        0 0 24px rgba(214,177,92,0.48),
        inset 0 0 12px rgba(0,0,0,0.62);
    z-index: 10;
    animation: activePulse 1s infinite alternate;
}

/* Completed tile */
.maze-box.completed {
    background: linear-gradient(180deg,
        rgba(65,95,78,0.62),
        rgba(20,31,28,0.88));
    border-color: rgba(214,177,92,0.38);
    box-shadow:
        0 0 8px rgba(214,177,92,0.28),
        inset 0 0 10px rgba(0,0,0,0.7);
}

/* Boss room highlights (10, 20, 30) — visual only */
.maze-box:nth-child(10) {
    text-shadow:
        0 0 8px #d6b15c,
        0 0 18px rgba(65,95,78,0.8);
}

.maze-box:nth-child(20) {
    text-shadow:
        0 0 8px #c46a3a,
        0 0 18px rgba(127,29,29,0.75);
}

.maze-box:nth-child(30) {
    text-shadow:
        0 0 10px #f0c75e,
        0 0 24px rgba(127,29,29,0.95),
        0 0 34px rgba(214,177,92,0.42);
}

/* Streak styling — National Ledger */
.streak {
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    letter-spacing:0.5px;
    color: rgba(243,234,210,0.94);
    text-shadow:
        0 0 7px rgba(214,177,92,0.32),
        0 2px 5px rgba(0,0,0,0.85);
}

.streak-icon {
    width:22px;
    height:22px;
    object-fit:contain;
    border-radius:50%;
    filter:
        drop-shadow(0 0 8px rgba(214,177,92,0.75))
        drop-shadow(0 0 15px rgba(100,36,24,0.52));
    background: radial-gradient(circle,
        rgba(240,199,94,0.46) 0%,
        rgba(65,95,78,0.34) 45%,
        transparent 72%);
    animation: pulseControl 2.2s ease-in-out infinite;
}
   
/* =========================================
   6. ARTIFACT SYSTEM (REWARDS) — SAFE TO CUSTOMIZE
========================================= */

    border: 1px solid rgba(214,177,92,0.34);

/* Artifact image in popup */

    text-shadow:

/* Layout container for artifact slots */
.vaultRow {
    display: flex;

    align-items:flex-end;
    gap: 15px;

/* Individual artifact slot (default = locked state) */    
.artifactSlot {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 70px;
    text-align:center;
    opacity: .26;
    transition: all .4s ease;
}

/* Locked artifact image (dimmed effect) */    
.artifactSlot img {
    width: 45px;
    margin-bottom:4px;
    filter:
        brightness(0.28)
        contrast(0.85)
        sepia(0.35);
    transition: all .4s ease;
}

/* Artifact label text */
.artifactSlot span {
    display: block;
    font-size: 13px;
    color: rgba(216,199,160,0.38);
    margin-top: 8px;
    line-height: 1.2;
}

/* Glow + animation for unlocked artifacts */
.artifactSlot.unlocked {
    opacity: 1;
    transform: scale(1.05);
}

.artifactSlot.unlocked img {
    filter:
        drop-shadow(0 0 14px rgba(240,199,94,0.86))
        drop-shadow(0 0 26px rgba(214,177,92,0.46))
        drop-shadow(0 0 34px rgba(127,29,29,0.24));
    animation: relicPulse 2.5s ease-in-out infinite;
    backface-visibility: hidden;
    transform: translateZ(0);
}

.artifactSlot.unlocked span {
    color: #f3ead2;
    font-weight: 600;
    text-shadow:
        0 0 7px rgba(214,177,92,0.38),
        0 2px 5px rgba(0,0,0,0.85);
}

	
/* =========================================
   7. BOSS EFFECTS & ATMOSPHERE — SAFE TO CUSTOMIZE
========================================= */
    
/* Hit animation — triggered when boss takes damage */
.boss-shake {
    animation: bossShake 0.5s cubic-bezier(.36,.07,.19,.97) both;
}

/* Boss image display — includes floating animation */
.bossIcon {
    width: 96px;
    height: auto;
    display: block;
    margin: 0 auto 12px auto;
    animation: bossFloat 4s ease-in-out infinite;
}

/* Boss 1 -specific glow effects */

        drop-shadow(0 0 12px rgba(214,177,92,0.82))

        drop-shadow(0 0 34px rgba(0,0,0,0.75));
}

	
/* Boss 2 -specific glow effects */	
.wardenGlow {
    filter:
        drop-shadow(0 0 14px rgba(196,106,58,0.88))

}



/* Boss 3 -specific glow effects */

    filter:
        drop-shadow(0 0 16px rgba(240,199,94,0.96))
        drop-shadow(0 0 34px rgba(127,29,29,0.74))
        drop-shadow(0 0 46px rgba(214,177,92,0.34))

/* Ambient torch effect — decorative, shown during gameplay */
.torch {

    width: 70px;

    z-index: 10;

}

.right-torch {

/* =========================================
   9. ANIMATION SYSTEM — SAFE TO CUSTOMIZE (WITH CARE)
========================================= */

/* Ambient lighting effect (environmental immersion) */    
@keyframes torchFlicker {
  0%, 100% {
    filter: brightness(1);
  }
  25% {
    filter: brightness(1.05) saturate(1.04);
  }
  50% {
    filter: brightness(0.96) saturate(0.98);
  }
  75% {
    filter: brightness(1.04) saturate(1.03);
  }
}

/* Damage feedback (quick impact effect) */    
@keyframes hitshake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  50% { transform: translateX(8px); }
  75% { transform: translateX(-6px); }
  100% { transform: translateX(0); }
}

/* Boss-specific hit feedback (stronger shake) */    
@keyframes bossShake {
  10%, 90% { transform: translate3d(-1px, 0, 0); }
  20%, 80% { transform: translate3d(2px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
  40%, 60% { transform: translate3d(4px, 0, 0); }
}

/* Current room highlight animation (maze tracker) */   
@keyframes activePulse {
  0% {
    transform: scale(1.06);
    box-shadow:
      0 0 8px rgba(214,177,92,0.68),
      inset 0 0 10px rgba(0,0,0,0.6);
  }
  45% {
    transform: scale(1.13);
    box-shadow:
      0 0 18px rgba(240,199,94,0.92),
      0 0 32px rgba(214,177,92,0.48),
      0 0 42px rgba(65,95,78,0.24),
      inset 0 0 12px rgba(0,0,0,0.64);
  }
  70% {
    transform: scale(1.09);
    box-shadow:
      0 0 12px rgba(214,177,92,0.78),
      0 0 24px rgba(127,29,29,0.24),
      inset 0 0 11px rgba(0,0,0,0.64);
  }
  100% {
    transform: scale(1.11);
    box-shadow:
      0 0 15px rgba(240,199,94,0.72),
      0 0 30px rgba(214,177,92,0.36),
      inset 0 0 12px rgba(0,0,0,0.68);
  }
}


	
	
/* Victory text animation (end screen emphasis) */    
@keyframes victoryGlow {
  0%, 100% {
    transform: scale(1);
    text-shadow:
      0 0 10px rgba(240,199,94,0.72),
      0 2px 6px rgba(0,0,0,0.9);
  }
  50% {
    transform: scale(1.08);
    text-shadow:
      0 0 24px rgba(240,199,94,0.95),
      0 0 42px rgba(214,177,92,0.62),
      0 0 52px rgba(127,29,29,0.36),
      0 3px 8px rgba(0,0,0,0.9);
  }
}


/* Idle boss movement (subtle hovering effect) */    
@keyframes bossFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* Temporary feedback text fade-out */   
@keyframes fadeOut {
  0%, 70% { opacity: 1; }
  100% { opacity: 0; }
}

/* Wizard idle animation (subtle movement) */    
@keyframes wizardFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* General UI entrance animation */    
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* General pulse animation for relics */   
@keyframes relicPulse {
  0%,100% {
    transform: scale(1.05);
    filter:
      drop-shadow(0 0 8px rgba(214,177,92,0.66))
      drop-shadow(0 0 18px rgba(65,95,78,0.34))
      drop-shadow(0 0 24px rgba(0,0,0,0.55));
  }
  50% {
    transform: scale(1.1);
    filter:
      drop-shadow(0 0 16px rgba(240,199,94,0.92))
      drop-shadow(0 0 30px rgba(214,177,92,0.55))
      drop-shadow(0 0 38px rgba(127,29,29,0.24));
  }
}

/* Streak Icon Glow */
@keyframes pulseControl {
  0%,100% {
    transform: scale(1);
    opacity: 0.9;
  }
  50% {
    transform: scale(1.08);
    opacity: 1;
  }
}

/* =========================================
   12. MOBILE RESPONSIVE SYSTEM — SAFE TO EDIT (WITH LIMITS)
=========================================

This section controls how the game behaves on phones.

GOAL:
- Fit gameplay into a single screen as much as possible
- Reduce vertical scrolling
- Keep buttons thumb-friendly

-----------------------------------------
SAFE TO EDIT:
- font sizes (clamp values)
- spacing (gap, padding, margin)
- grid layout (answers: 1fr 1fr vs 1fr)
- wizard size (make smaller/larger)

-----------------------------------------
USE CAUTION:
- removing elements entirely (may break flow)
- changing flex direction randomly
- making buttons too small (hurts usability)

-----------------------------------------
DO NOT MODIFY:
- IDs (#gameShell, #gameBox, #wizardBox)
- core layout structure

-----------------------------------------
COMMON CUSTOM CHANGES:
- Want bigger buttons? Increase min-height
- Want less scrolling? Reduce padding/gaps
- Want simpler UI? Hide artifact labels

-----------------------------------------
TIP:
Mobile design is about SPACE, not style.
Every pixel matters.

========================================= */

function generatePseudonymFromEmail(email) {
    const titles = [
        "Axiom", "Ledger", "Vector", "Meridian", "Signal", "Cipher",
        "Frontier", "Equity", "Oracle", "Index", "Summit", "Nexus",
        "Vault", "Prism", "Civic", "Astral", "Beacon", "Horizon"
    ];

    const roles = [
        "Appraiser", "Cartographer", "Arbiter", "Custodian", "Warden", "Registrar",
        "Archivist", "Surveyor", "Magistrate", "Keeper", "Analyst", "Mediator",
        "Steward", "Scribe", "Sentinel", "Marshal", "Seeker", "Auditor"
    ];

    let hash = 0;
    const cleanEmail = email.trim().toLowerCase();

    for (let i = 0; i < cleanEmail.length; i++) {
        hash = ((hash << 5) - hash) + cleanEmail.charCodeAt(i);
        hash |= 0;
    }

    const positiveHash = Math.abs(hash);

    const title = titles[positiveHash % titles.length];
    const role = roles[Math.floor(positiveHash / titles.length) % roles.length];
    const number = 1000 + (positiveHash % 9000);

    return `${title}${role}${number}`;
}

function getTypeBucket(tag, type){
    const tagBucket = getTagBucket(tag);
    if(!tagBucket) return null;
    const key = type || "default";
    if(!tagBucket.byType[key]){
        tagBucket.byType[key] = {
            attempts: 0,
            correct: 0,
            avgTime: 0
        };
    }
    return tagBucket.byType[key];
}

function getSkillKey(question){
    return question?.primarySkill || question?.repairSkill || inferSkill(question) || null;
}

function getSkillBucket(question){
    const skill = getSkillKey(question);
    if(!skill) return null;

    if(!masteryState.bySkill){
        masteryState.bySkill = {};
    }

    if(!masteryState.bySkill[skill]){
        masteryState.bySkill[skill] = {
            attempts: 0,
            correct: 0,
            avgTime: 0,
            byType: {}
        };
    }

    return masteryState.bySkill[skill];
}


function inferObjective(question){
    if(!question) return "general";
    if(question.objective) return question.objective;

    const q = (question.q || "").toLowerCase();
    const tag = (question.tag || "general").toLowerCase();
    const type = (question.type || "default").toLowerCase();

    // =============================================
    // NATIONAL LEDGER OBJECTIVE INFERENCE
    // Chapters 24, 25, 26, 29
    // GDP, CPI, growth/productivity, unemployment
    // =============================================

    // -----------------------------
    // CHAPTER 24 — Measuring a Nation's Income
    // -----------------------------

    if(tag === "gdp_income_expenditure"){
        return "LO24.1";
    }

    if(tag === "gdp_definition"){
        return "LO24.2";
    }

    if(tag === "gdp_components"){
        return "LO24.3";
    }

    if(tag === "real_nominal_gdp"){
        return "LO24.4";
    }

    if(tag === "gdp_wellbeing"){
        return "LO24.5";
    }

    // Question-text backup for Chapter 24
    if(q.includes("income equals expenditure") || q.includes("total income") || q.includes("total expenditure") || q.includes("income-expenditure") || q.includes("income and expenditure")){
        return "LO24.1";
    }

    if(q.includes("gdp") || q.includes("gross domestic product") || q.includes("final good") || q.includes("intermediate good") || q.includes("value added") || q.includes("current production") || q.includes("used good")){
        if(q.includes("nominal gdp") || q.includes("real gdp") || q.includes("gdp deflator") || q.includes("base-year") || q.includes("current-year prices")){
            return "LO24.4";
        }

        if(q.includes("consumption") || q.includes("investment") || q.includes("government purchases") || q.includes("net exports") || q.includes("exports") || q.includes("imports") || q.includes("inventory")){
            return "LO24.3";
        }

        if(q.includes("well-being") || q.includes("well being") || q.includes("leisure") || q.includes("pollution") || q.includes("environment") || q.includes("quality of life") || q.includes("inequality")){
            return "LO24.5";
        }

        return "LO24.2";
    }

    // -----------------------------
    // CHAPTER 25 — Measuring the Cost of Living
    // -----------------------------

    if(tag === "cpi_inflation"){
        return "LO25.1";
    }

    if(tag === "cpi_bias"){
        return "LO25.2";
    }

    if(tag === "cpi_vs_deflator"){
        return "LO25.3";
    }

    if(tag === "inflation_adjustment"){
        return "LO25.4";
    }

    if(tag === "interest_inflation"){
        return "LO25.5";
    }

    // Question-text backup for Chapter 25
    if(q.includes("consumer price index") || q.includes("cpi") || q.includes("inflation rate") || q.includes("basket cost") || q.includes("fixed basket")){
        if(q.includes("substitution") || q.includes("quality") || q.includes("new goods") || q.includes("cost of living") || q.includes("overstate")){
            return "LO25.2";
        }

        if(q.includes("gdp deflator") || q.includes("imported") || q.includes("domestic production") || q.includes("current domestic production")){
            return "LO25.3";
        }

        return "LO25.1";
    }

    if(q.includes("today's dollars") || q.includes("today’s dollars") || q.includes("purchasing power") || q.includes("adjusted for inflation") || q.includes("price level today") || q.includes("price index ratio")){
        return "LO25.4";
    }

    if(q.includes("nominal interest") || q.includes("real interest") || q.includes("real return") || q.includes("borrower") || q.includes("lender")){
        return "LO25.5";
    }

    // -----------------------------
    // CHAPTER 26 — Production and Growth
    // -----------------------------

    if(tag === "growth_differences"){
        return "LO26.1";
    }

    if(tag === "productivity"){
        return "LO26.2";
    }

    if(tag === "productivity_factors" || tag === "diminishing_returns" || tag === "catch_up_growth"){
        return "LO26.3";
    }

    if(tag === "growth_policy"){
        return "LO26.4";
    }

    // Question-text backup for Chapter 26
    if(q.includes("rule of 70") || q.includes("double") || q.includes("growth rate") || q.includes("real gdp per person") || q.includes("living standards across countries")){
        return "LO26.1";
    }

    if(q.includes("productivity") || q.includes("output per worker") || q.includes("output per hour") || q.includes("output divided by labor")){
        return "LO26.2";
    }

    if(q.includes("physical capital") || q.includes("human capital") || q.includes("natural resources") || q.includes("technological knowledge") || q.includes("diminishing returns") || q.includes("catch-up") || q.includes("catch up") || q.includes("capital per worker")){
        return "LO26.3";
    }

    if(q.includes("property rights") || q.includes("political stability") || q.includes("saving and investment") || q.includes("foreign investment") || q.includes("education") || q.includes("research and development") || q.includes("free trade") || q.includes("growth policy")){
        return "LO26.4";
    }

    // -----------------------------
    // CHAPTER 29 — Unemployment
    // -----------------------------

    if(tag === "labor_force_stats"){
        return "LO29.1";
    }

    if(tag === "employment_categories"){
        return "LO29.2";
    }

    if(tag === "unemployment_types"){
        return "LO29.3";
    }

    if(tag === "labor_market_policy"){
        return "LO29.4";
    }

    if(tag === "natural_unemployment"){
        return "LO29.5";
    }

    if(tag === "labor_market_synthesis"){
        return "LO29.1_LO29.2_LO29.5";
    }

    if(tag === "macro_integration"){
        return "integrated_macro_review";
    }

    // Question-text backup for Chapter 29
    if(q.includes("labor force participation") || q.includes("unemployment rate") || q.includes("labor force equals") || q.includes("employed plus unemployed")){
        return "LO29.1";
    }

    if(q.includes("employed") || q.includes("unemployed") || q.includes("not in the labor force") || q.includes("discouraged worker") || q.includes("part-time") || q.includes("underemployment")){
        return "LO29.2";
    }

    if(q.includes("frictional") || q.includes("structural") || q.includes("cyclical") || q.includes("job search") || q.includes("skill mismatch") || q.includes("recession")){
        return "LO29.3";
    }

    if(q.includes("minimum wage") || q.includes("unemployment insurance") || q.includes("union") || q.includes("efficiency wage") || q.includes("labor surplus") || q.includes("wage floor")){
        return "LO29.4";
    }

    if(q.includes("natural rate") || q.includes("actual unemployment") || q.includes("cyclical unemployment") || q.includes("normal unemployment")){
        return "LO29.5";
    }

    return `${tag}_${type}`;
}

function inferSkill(question){
    if(!question) return null;

    if(question.primarySkill) return question.primarySkill;
    if(question.repairSkill) return question.repairSkill;
    if(question.skill) return question.skill;

    const q = (question.q || "").toLowerCase();
    const tag = (question.tag || "").toLowerCase();
    const objective = (question.objective || "").toLowerCase();

    // =============================================
    // CHAPTER 24 — GDP skills
    // =============================================

    if(tag === "gdp_income_expenditure" || objective === "lo24.1" || q.includes("income equals expenditure") || q.includes("total income") || q.includes("total expenditure") || q.includes("income-expenditure")){
        return "income_expenditure_identity";
    }

    if(tag === "gdp_definition" || objective === "lo24.2"){
        if(q.includes("intermediate good") || q.includes("final good") || q.includes("double count") || q.includes("value added") || q.includes("flour") || q.includes("bakery")){
            return "intermediate_vs_final_goods";
        }

        return "gdp_counting_rules";
    }

    if(tag === "gdp_components" || objective === "lo24.3"){
        if(q.includes("exports") || q.includes("imports") || q.includes("net exports") || q.includes("imported")){
            return "imports_exports_nx";
        }

        if(q.includes("inventory") || q.includes("unsold") || q.includes("produces") && q.includes("sells only")){
            return "inventory_investment";
        }

        return "gdp_components_identity";
    }

    if(tag === "real_nominal_gdp" || objective === "lo24.4"){
        if(q.includes("gdp deflator") || q.includes("deflator") || q.includes("nominal gdp") && q.includes("real gdp")){
            return "gdp_deflator";
        }

        return "nominal_vs_real_gdp";
    }

    if(tag === "gdp_wellbeing" || objective === "lo24.5" || q.includes("well-being") || q.includes("well being") || q.includes("leisure") || q.includes("pollution") || q.includes("quality of life") || q.includes("environment")){
        return "gdp_wellbeing_limits";
    }

    // =============================================
    // CHAPTER 25 — CPI, inflation, real interest skills
    // =============================================

    if(tag === "cpi_inflation" || objective === "lo25.1"){
        if(q.includes("inflation rate") || q.includes("rises from") || q.includes("falls from") || q.includes("percentage change")){
            return "inflation_rate";
        }

        return "cpi_calculation";
    }

    if(tag === "cpi_bias" || objective === "lo25.2"){
        if(q.includes("substitution") || q.includes("cheaper") || q.includes("switch") || q.includes("beef") || q.includes("chicken")){
            return "substitution_bias";
        }

        return "quality_new_goods_bias";
    }

    if(tag === "cpi_vs_deflator" || objective === "lo25.3" || q.includes("gdp deflator") || q.includes("imported consumer") || q.includes("domestic production")){
        return "cpi_vs_gdp_deflator";
    }

    if(tag === "inflation_adjustment" || objective === "lo25.4" || q.includes("today's dollars") || q.includes("today’s dollars") || q.includes("same purchasing power") || q.includes("adjusted for inflation")){
        return "inflation_adjustment";
    }

    if(tag === "interest_inflation" || objective === "lo25.5" || q.includes("nominal interest") || q.includes("real interest") || q.includes("real return") || q.includes("borrower") || q.includes("lender")){
        return "real_interest_rate";
    }

    // =============================================
    // CHAPTER 26 — Growth and productivity skills
    // =============================================

    if(tag === "growth_differences" || objective === "lo26.1"){
        if(q.includes("rule of 70") || q.includes("double") || q.includes("doubling")){
            return "rule_of_70";
        }

        return "real_gdp_per_person";
    }

    if(tag === "productivity" || objective === "lo26.2" || q.includes("productivity") || q.includes("output per worker") || q.includes("output per hour")){
        return "productivity_calculation";
    }

    if(tag === "productivity_factors" || objective === "lo26.3"){
        if(q.includes("physical capital") || q.includes("machines") || q.includes("tools") || q.includes("equipment") || q.includes("infrastructure")){
            return "physical_capital";
        }

        if(q.includes("human capital") || q.includes("education") || q.includes("training") || q.includes("skills") || q.includes("apprenticeship")){
            return "human_capital";
        }

        if(q.includes("natural resources") || q.includes("oil") || q.includes("minerals") || q.includes("land") || q.includes("water") || q.includes("copper")){
            return "natural_resources";
        }

        if(q.includes("technological knowledge") || q.includes("technology") || q.includes("production method") || q.includes("new method") || q.includes("algorithm")){
            return "technological_knowledge";
        }

        return "productivity_calculation";
    }

    if(tag === "diminishing_returns" || q.includes("diminishing returns") || q.includes("less extra output") || q.includes("less additional output")){
        return "diminishing_returns";
    }

    if(tag === "catch_up_growth" || q.includes("catch-up") || q.includes("catch up") || q.includes("capital is scarce") || q.includes("scarce capital")){
        return "catch_up_effect";
    }

    if(tag === "growth_policy" || objective === "lo26.4" || q.includes("property rights") || q.includes("saving") || q.includes("investment") || q.includes("foreign investment") || q.includes("political stability") || q.includes("free trade") || q.includes("research and development") || q.includes("r&d")){
        return "growth_policy";
    }

    // =============================================
    // CHAPTER 29 — Unemployment skills
    // =============================================

    if(tag === "labor_force_stats" || objective === "lo29.1"){
        if(q.includes("labor force participation") || q.includes("participation rate")){
            return "labor_force_participation";
        }

        if(q.includes("unemployment rate") || q.includes("what is the unemployment") || q.includes("unemployed divided")){
            return "unemployment_rate";
        }

        return "labor_force_calculation";
    }

    if(tag === "employment_categories" || objective === "lo29.2"){
        if(q.includes("discouraged") || q.includes("stopped searching") || q.includes("stop searching") || q.includes("not actively searching")){
            return "discouraged_workers";
        }

        return "employment_classification";
    }

    if(tag === "unemployment_types" || objective === "lo29.3"){
        if(q.includes("frictional") || q.includes("job search") || q.includes("searching for a better") || q.includes("between jobs")){
            return "frictional_unemployment";
        }

        if(q.includes("structural") || q.includes("skill mismatch") || q.includes("mismatch") || q.includes("automation") || q.includes("obsolete") || q.includes("permanently")){
            return "structural_unemployment";
        }

        if(q.includes("cyclical") || q.includes("recession") || q.includes("downturn") || q.includes("weak demand") || q.includes("business cycle")){
            return "cyclical_unemployment";
        }

        return "structural_unemployment";
    }

    if(tag === "labor_market_policy" || objective === "lo29.4"){
        if(q.includes("minimum wage") || q.includes("wage floor") || q.includes("labor surplus") || q.includes("quantity supplied") || q.includes("quantity demanded")){
            return "minimum_wage_surplus";
        }

        if(q.includes("union") || q.includes("efficiency wage") || q.includes("above-equilibrium wages") || q.includes("above equilibrium wages") || q.includes("turnover") || q.includes("worker effort")){
            return "unions_efficiency_wages";
        }

        if(q.includes("unemployment insurance") || q.includes("job-search assistance") || q.includes("job search assistance") || q.includes("benefits")){
            return "frictional_unemployment";
        }

        return "unions_efficiency_wages";
    }

    if(tag === "natural_unemployment" || objective === "lo29.5" || q.includes("natural rate") || q.includes("actual unemployment") || q.includes("cyclical unemployment") || q.includes("normal unemployment")){
        return "natural_rate";
    }

    if(tag === "labor_market_synthesis"){
        if(q.includes("discouraged")) return "discouraged_workers";
        if(q.includes("part-time") || q.includes("underemployment")) return "employment_classification";
        if(q.includes("natural rate")) return "natural_rate";
        return "labor_force_calculation";
    }

    if(tag === "macro_integration"){
        if(q.includes("real wages") || q.includes("nominal wages") || q.includes("cpi")) return "inflation_adjustment";
        if(q.includes("unemployment")) return "labor_force_calculation";
        if(q.includes("nominal gdp") || q.includes("real gdp")) return "nominal_vs_real_gdp";
        return "integrated_macro_review";
    }

    return null;
}

function getObjectiveBucket(question){
    const objectiveKey = inferObjective(question);
    if(!masteryState.byObjective[objectiveKey]){
        masteryState.byObjective[objectiveKey] = {
            attempts: 0,
            correct: 0,
            avgTime: 0
        };
    }
    return masteryState.byObjective[objectiveKey];
}

function getObjectiveAccuracy(question){
    return getAccuracy(getObjectiveBucket(question));
}

function getObjectiveFluency(question){
    return getFluency(getObjectiveBucket(question), question?.type || "default");
}

function updateBucket(bucket, isCorrect, responseTime){
    if(!bucket) return;
    bucket.attempts++;
    if(isCorrect) bucket.correct++;
    bucket.avgTime = bucket.avgTime === 0
        ? responseTime
        : Math.round((bucket.avgTime * 0.7) + (responseTime * 0.3));
}

function getAccuracy(bucket){
    if(!bucket || !bucket.attempts) return null;
    return bucket.correct / bucket.attempts;
}

function getTimeRatio(bucket, type){
    if(!bucket || !bucket.attempts || !bucket.avgTime) return 1;
    return bucket.avgTime / getTypeTargetMs(type);
}

function getFluency(bucket, type){
    const acc = getAccuracy(bucket);
    if(acc === null) return 0;
    const timeRatio = getTimeRatio(bucket, type);
    return acc - clamp((timeRatio - 1) * 0.25, 0, 0.35);
}

function getTagAccuracy(tag){
    return getAccuracy(getTagBucket(tag));
}

function getTagTypeAccuracy(tag, type){
    return getAccuracy(getTypeBucket(tag, type));
}

function getTagFluency(tag){
    return getFluency(getTagBucket(tag), "default");
}

function getTagTypeFluency(tag, type){
    return getFluency(getTypeBucket(tag, type), type || "default");
}

function recordAdaptiveAttempt(question, isCorrect, responseTime){
    if(!question || !question.tag) return;

    const tagBucket = getTagBucket(question.tag);
    const typeBucket = getTypeBucket(question.tag, question.type);
    const objectiveBucket = getObjectiveBucket(question);
    const skillBucket = getSkillBucket(question);

    updateBucket(tagBucket, isCorrect, responseTime);
    updateBucket(typeBucket, isCorrect, responseTime);
    updateBucket(objectiveBucket, isCorrect, responseTime);
    updateBucket(skillBucket, isCorrect, responseTime);

    masteryState.recent.push({
        correct: !!isCorrect,
        responseTime,
        tag: question.tag,
        type: question.type || "default",
        objective: currentQuestion.objective || inferObjective(currentQuestion),
        skill: getSkillKey(question)
    });

    if(masteryState.recent.length > 20){
        masteryState.recent.shift();
    }
}

function getRecentPerformance(windowSize = 8){
    const recent = masteryState.recent.slice(-windowSize);
    if(recent.length === 0){
        return { accuracy: 0, avgCorrectRatio: 1.2, count: 0 };
    }

    const correct = recent.filter(x => x.correct);
    const avgCorrectRatio = correct.length
        ? correct.reduce((sum, item) => sum + (item.responseTime / getTypeTargetMs(item.type)), 0) / correct.length
        : 2;

    return {
        accuracy: recent.filter(x => x.correct).length / recent.length,
        avgCorrectRatio,
        count: recent.length
    };
}

function getWeakestTag(){
    const entries = Object.keys(masteryState.byTag);

    if(entries.length === 0){
        const fallback = Object.entries(conceptMemory || {}).sort((a,b) => b[1]-a[1])[0];
        return fallback ? fallback[0] : null;
    }

    let weakestTag = null;
    let weakestScore = -Infinity;

    entries.forEach(tag => {
        const fluency = getTagFluency(tag);
        const weakness = (conceptMemory[tag] || 0) + (1 - (fluency ?? 0));

        if(weakness > weakestScore){
            weakestScore = weakness;
            weakestTag = tag;
        }
    });

    return weakestTag;
}

function getStrongestTag(){
    const entries = Object.keys(masteryState.byTag);
    if(entries.length === 0) return null;

    let strongestTag = null;
    let strongestScore = -Infinity;

    entries.forEach(tag => {
        const fluency = getTagFluency(tag);
        const strength = (fluency === null ? 0 : fluency) - ((conceptMemory[tag] || 0) * 0.15);
        if(strength > strongestScore){
            strongestScore = strength;
            strongestTag = tag;
        }
    });

    return strongestTag;
}

function getBossObjectiveKey(question){
    if(!question) return null;

    const rawObjective = question.objective || inferObjective(question);
    if(!rawObjective) return null;

    const match = String(rawObjective).match(/^LO\d+\.\d+/);
    return match ? match[0] : rawObjective;
}

function getObjectiveFamilyStats(objectiveKey){
    let attempts = 0;
    let correct = 0;
    let weightedTime = 0;

    Object.keys(masteryState.byObjective || {}).forEach(key => {
        if(key === objectiveKey || key.startsWith(objectiveKey + "_")){
            const bucket = masteryState.byObjective[key];
            if(!bucket) return;

            attempts += bucket.attempts || 0;
            correct += bucket.correct || 0;
            weightedTime += (bucket.avgTime || 0) * (bucket.attempts || 0);
        }
    });

    return {
        attempts,
        correct,
        accuracy: attempts ? correct / attempts : null,
        avgTime: attempts ? weightedTime / attempts : 0
    };
}

function getWeakestBossObjective(bank){
    if(!Array.isArray(bank) || bank.length === 0) return null;

    const objectives = [...new Set(
        bank.map(q => getBossObjectiveKey(q)).filter(Boolean)
    )];

    const eligibleObjectives = objectives.filter(obj =>
        bank.filter(q => getBossObjectiveKey(q) === obj).length >= 3
    );

    if(eligibleObjectives.length === 0) return null;

    let weakestObjective = null;
    let weakestScore = -Infinity;

    eligibleObjectives.forEach(obj => {
        const stats = getObjectiveFamilyStats(obj);

        let score = 0.25;

        if(stats.accuracy !== null){
            score = (1 - stats.accuracy) * 2;
            score += Math.min(stats.attempts, 5) * 0.08;
        }

        const recentMisses = (masteryState.recent || []).filter(item => {
            const itemObjective = item.objective || "";
            return (itemObjective === obj || itemObjective.startsWith(obj + "_")) && !item.correct;
        }).length;

        score += recentMisses * 0.25;

        if(stats.avgTime && stats.avgTime > TYPE_TIME_TARGETS.default){
            score += 0.15;
        }

        if(score > weakestScore){
            weakestScore = score;
            weakestObjective = obj;
        }
    });

    return weakestObjective || eligibleObjectives[Math.floor(Math.random() * eligibleObjectives.length)];
}

function getSelectionProfile(){
    const recent = getRecentPerformance(8);
    const strongestTag = getStrongestTag();
    const strongestFluency = strongestTag ? getTagFluency(strongestTag) : 0;

    return {
        recentAccuracy: recent.accuracy,
        avgCorrectRatio: recent.avgCorrectRatio,
        strongestTag,
        strongestFluency,
        mediumReady: streak >= 5 && recent.count >= 5 && recent.accuracy >= 0.8,
        hardReady: streak >= 8 && recent.count >= 6 && recent.accuracy >= 0.88 && recent.avgCorrectRatio <= 1.2 && strongestFluency >= 0.72,
        eliteReady: streak >= 14 && recent.count >= 8 && recent.accuracy >= 0.92 && recent.avgCorrectRatio <= 1.05 && strongestFluency >= 0.82
    };
}

function determineSelectionPurpose(profile){
    if(profile.recentAccuracy === 0 && getRecentPerformance(8).count === 0) return "support";
    if(profile.eliteReady) return "stretch";
    if(profile.recentAccuracy < 0.65) return "repair";
    if(profile.recentAccuracy < 0.8) return "confirm";
    if(profile.hardReady) return "challenge";
    return "diversify";
}

function shouldTriggerDetour(question){
    if(!question || !question.tag) return false;
    const tagWeakness = conceptMemory[question.tag] || 0;
    const typeBucket = getTypeBucket(question.tag, question.type);
    const typeAccuracy = getAccuracy(typeBucket);
    const objectiveAccuracy = getObjectiveAccuracy(question);

    return tagWeakness >= 2.2
        || (typeBucket && typeBucket.attempts >= 2 && typeAccuracy !== null && typeAccuracy < 0.6)
        || (objectiveAccuracy !== null && objectiveAccuracy < 0.5 && getObjectiveBucket(question).attempts >= 2);
}

function resetRemediationState(){
	remediationState = {
 	   active: false,
 	   stage: null,
  	   tag: null,
  	   objective: null,
       skill: null,
       commonError: null,
       sourceType: null,
       returnRoom: null,

       careless: false
   };
    detourActive = false;
    detourReturnRoom = null;
}

function planRemediation(question, responseTime){
    if(!question || !question.tag) return null;

    const expected = getTypeTargetMs(question.type);
    const objectiveBucket = getObjectiveBucket(question);
    const objectiveAccuracy = getAccuracy(objectiveBucket);
    const objectiveAttempts = objectiveBucket?.attempts || 0;
    const carelessMiss = responseTime < expected * 0.55 && (objectiveAccuracy === null || objectiveAccuracy >= 0.45);
    const repeatedObjectiveMiss = objectiveAttempts >= 2 && objectiveAccuracy !== null && objectiveAccuracy < 0.6;
    const slowStruggle = responseTime > expected * 1.2;
    const skill = getSkillKey(question);

    return {
        active: true,
        stage: carelessMiss ? "bridge" : "repair",
        tag: question.tag,
        objective: currentQuestion.objective || inferObjective(currentQuestion),
        skill: skill,
        commonError: question.commonError || null,
        sourceType: question.type || "default",
        returnRoom: room,
        originQuestionId: question.id || null,
        careless: carelessMiss,
        repeatedObjectiveMiss,
        slowStruggle
    };
}

function getQuestionsMatchingNeed(pool, objectiveKey, tag, excludeIds = [], skillKey = null){
    if(!Array.isArray(pool) || pool.length === 0) return [];

    let candidates = pool.filter(q => !excludeIds.includes(q.id));

    if(skillKey){
        let skillMatches = candidates.filter(q =>
            q.primarySkill === skillKey || q.repairSkill === skillKey || inferSkill(q) === skillKey
        );
        if(skillMatches.length > 0) return skillMatches;
    }

    let objectiveMatches = candidates.filter(q => inferObjective(q) === objectiveKey);
    if(objectiveMatches.length > 0) return objectiveMatches;

    let tagMatches = candidates.filter(q => q.tag === tag);
    if(tagMatches.length > 0) return tagMatches;

    return candidates;
}

function pickRemediationFromBank(poolName, objectiveKey, tag, purpose = "confirm", skillKey = null){
    const pool = questionBanks[poolName] || [];
    const recentIds = (questionHistory[poolName] || []).slice(-10);
    let candidates = getQuestionsMatchingNeed(pool, objectiveKey, tag, recentIds, skillKey);

    if(candidates.length === 0){
        candidates = getQuestionsMatchingNeed(pool, objectiveKey, tag, [], skillKey);
    }

    if(candidates.length === 0) return null;

    const picked = weightedPick(candidates, {
        mode: purpose === "challenge" ? "challenge" : "support",
        preferredTypes: purpose === "challenge" ? ELITE_PREFERRED_TYPES : [],
        purpose
    });

    if(!questionHistory[poolName]) questionHistory[poolName] = [];
    questionHistory[poolName].push(picked.id);
    if(questionHistory[poolName].length > 15) questionHistory[poolName].shift();

    if(picked.tag){
        tagHistory.push(picked.tag);
        if(tagHistory.length > 10) tagHistory.shift();
    }

    return picked;
}

function getRemediationQuestion(state){
    if(!state || !state.active) return null;

    const excludeIds = [state.originQuestionId].filter(Boolean);

    if(state.stage === "repair"){
        if(state.skill && microSkillRepairPools[state.skill]){
            const skillRepairPool = microSkillRepairPools[state.skill] || [];
            const skillRepairCandidates = getQuestionsMatchingNeed(
                skillRepairPool,
                state.objective,
                state.tag,
                excludeIds,
                state.skill
            );

            if(skillRepairCandidates.length > 0){
                return weightedPick(skillRepairCandidates, {
                    mode: "support",
                    purpose: "repair"
                });
            }
        }

        const allRepairPool = Object.values(microSkillRepairPools).reduce((all, pool) => all.concat(pool), []);
        const repairCandidates = getQuestionsMatchingNeed(
            allRepairPool,
            state.objective,
            state.tag,
            excludeIds,
            state.skill
        );

        if(repairCandidates.length > 0){
            return weightedPick(repairCandidates, {
                mode: "support",
                purpose: "repair"
            });
        }
    }

    if(state.stage === "bridge"){
        if(state.skill && microSkillBridgePools[state.skill]){
            const skillBridgePool = microSkillBridgePools[state.skill] || [];
            const skillBridgeCandidates = getQuestionsMatchingNeed(
                skillBridgePool,
                state.objective,
                state.tag,
                excludeIds,
                state.skill
            );

            if(skillBridgeCandidates.length > 0){
                return weightedPick(skillBridgeCandidates, {
                    mode: "support",
                    purpose: "confirm"
                });
            }
        }

        const allBridgePool = Object.values(microSkillBridgePools || {})
            .reduce((all, pool) => all.concat(pool), []);

        const bridgeCandidates = getQuestionsMatchingNeed(
            allBridgePool,
            state.objective,
            state.tag,
            excludeIds,
            state.skill
        );

        if(bridgeCandidates.length > 0){
            return weightedPick(bridgeCandidates, {
                mode: "support",
                purpose: "confirm"
            });
        }
    }

    const retestPoolName = getRetestPoolName();

    return pickRemediationFromBank(
        retestPoolName,
        state.objective,
        state.tag,
        state.stage === "retest" ? "challenge" : "confirm",
        state.skill
    );
}

function weightedPick(pool, options = {}){
    const {
        mode = "support",
        preferredTypes = [],
        purpose = "diversify"
    } = options;

    let totalWeight = 0;

    let weights = pool.map(q => {
        let w = 1;
        const tagAccuracy = q.tag ? getTagAccuracy(q.tag) : null;
        const typeAccuracy = (q.tag && q.type) ? getTagTypeAccuracy(q.tag, q.type) : null;
        const objectiveAccuracy = getObjectiveAccuracy(q);
        const tagFluency = q.tag ? getTagFluency(q.tag) : 0;
        const typeFluency = (q.tag && q.type) ? getTagTypeFluency(q.tag, q.type) : 0;
        const objectiveFluency = getObjectiveFluency(q);
        const conceptWeakness = q.tag ? (conceptMemory[q.tag] || 0) : 0;

        let recentCount = tagHistory.filter(t => t === q.tag).length;

        if(mode === "challenge"){
            w += clamp(tagFluency || 0, 0, 1.2) * 0.9;
            w += clamp(typeFluency || 0, 0, 1.0) * 0.6;
            w += clamp(objectiveFluency || 0, 0, 1.0) * 0.5;
            w += getTypePressure(q.type || "default");
            if(preferredTypes.includes(q.type)) w += 1.1;
            if(purpose === "stretch") w += 0.8;
        } else {
            const tagNeed = tagAccuracy === null ? 0.45 : (1 - tagAccuracy);
            const typeNeed = typeAccuracy === null ? 0.35 : (1 - typeAccuracy);
            const objectiveNeed = objectiveAccuracy === null ? 0.35 : (1 - objectiveAccuracy);
            const slowPenalty = clamp((getTimeRatio(getTypeBucket(q.tag, q.type), q.type) - 1), 0, 1.2);

            w += Math.min(conceptWeakness, 2.2);
            w += tagNeed * 0.7;
            w += typeNeed * 0.55;
            w += objectiveNeed * 0.85;
            w += slowPenalty * 0.35;

            if(purpose === "repair" && objectiveNeed > 0.35) w += 0.9;
            if(purpose === "confirm" && typeNeed > 0.25) w += 0.5;
        }

        // Coverage boost
        if(recentCount === 0){
            w += purpose === "diversify" ? 0.7 : 0.4;
        }

        w = Math.min(w, mode === "challenge" ? 5.5 : 4.5);
        totalWeight += w;
        return { q, w };
    });

    let r = Math.random() * totalWeight;

    for(let item of weights){
        r -= item.w;
        if(r <= 0){
            return item.q;
        }
    }

    return weights[weights.length - 1].q;
}

function getAdaptiveQuestion(poolName, targetTag = null, options = {}){
    let pool = questionBanks[poolName] || questionBanks.hard || questionBanks.medium || questionBanks.easy || [];
    const { mode = "support", preferredTypes = [], purpose = "diversify" } = options;

    if(!pool || pool.length === 0){
        return {
            id: 999999,
            q: "No question pool is available for this room. Check the questionBanks configuration.",
            options: ["Continue", "Continue", "Continue", "Continue"],
            a: 0,
            tag: "system",
            type: "default",
            objective: "system_check",
            feedback: "A question pool is missing."
        };
    }

    // --- 🎯 TARGET SPECIFIC TAG IF PROVIDED ---
    if(targetTag){
        let filtered = pool.filter(q => q.tag === targetTag);

        if(filtered.length >= Math.max(4, pool.length * 0.2)){
            pool = filtered;
        }
    }

    let recent = questionHistory[poolName].slice(-10);

    let available = pool.filter(q => !recent.includes(q.id));

    if(available.length < 3){
        available = pool.filter(q => !questionHistory[poolName].slice(-5).includes(q.id));
    }

    if(available.length === 0){
        available = pool.filter(q => !questionHistory[poolName].slice(-3).includes(q.id));
    }

    if(available.length === 0){
        available = pool;
    }

    let lastTags = tagHistory.slice(-2);

    let tagFiltered = available.filter(q => {
        return !(lastTags.length === 2 && lastTags.every(t => t === q.tag));
    });

    if(tagFiltered.length >= 3){
        available = tagFiltered;
    }

    console.log("AVAILABLE:", available.map(q => q.id));

    let picked = weightedPick(available, { mode, preferredTypes, purpose });

    console.log("PICKED:", picked.id);
    console.log("RECENT:", questionHistory[poolName]);

    questionHistory[poolName].push(picked.id);
    if(questionHistory[poolName].length > 15){
        questionHistory[poolName].shift();
    }

    if(picked.tag){
        tagHistory.push(picked.tag);
        if(tagHistory.length > 10){
            tagHistory.shift();
        }
    }

    return picked;
}

function stopTimedModeClock(){
    if(timedModeTimerInterval){
        clearInterval(timedModeTimerInterval);
        timedModeTimerInterval = null;
    }

    const hud = document.getElementById("timedModeHud");
    if(hud) hud.style.display = "none";

    const timerDisplay = document.getElementById("timerDisplay");
    if(timerDisplay){
        timerDisplay.classList.remove("timer-warning");
        timerDisplay.innerText = "10:00";
    }
}

function updateTimedModeClock(){
    if(gameMode !== "timed" || !timedModeEndTime) return;

    const remainingMs = Math.max(0, timedModeEndTime - Date.now());
    const totalSeconds = Math.ceil(remainingMs / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    const timerDisplay = document.getElementById("timerDisplay");
    if(timerDisplay){
        timerDisplay.innerText = `${minutes}:${String(seconds).padStart(2, "0")}`;
        timerDisplay.classList.toggle("timer-warning", remainingMs <= 60 * 1000);
    }

    if(remainingMs <= 0){
        endTimedModeRun();
    }
}

function endTimedModeRun(){
    if(gameMode !== "timed") return;

    stopTimedModeClock();
    gameMode = "timed-complete";

    const accuracy = totalAttempts > 0
        ? Math.round((correctAnswers / totalAttempts) * 100)
        : 0;

    const bestRoom = Number(localStorage.getItem("nationalLedgerTimedBestRoom") || 0);
    if(timedHighestRoom > bestRoom){
        localStorage.setItem("nationalLedgerTimedBestRoom", String(timedHighestRoom));
    }

    localStorage.setItem("nationalLedgerTimedLastRoom", String(room));
    localStorage.setItem("nationalLedgerTimedLastHighestRoom", String(timedHighestRoom));
    localStorage.setItem("nationalLedgerTimedLastAccuracy", String(accuracy));
    localStorage.setItem("nationalLedgerTimedLastAttempts", String(totalAttempts));
    localStorage.setItem("nationalLedgerTimedLastStreak", String(maxStreak));
    localStorage.setItem("nationalLedgerTimedLastSetbacks", String(timedSetbacks));

    recordTimedTrialAchievementStats(accuracy, timedHighestRoom);

    sendGameData({
        runID: runID,
        game: "The National Ledger",
        event: "timed_complete",
        user: username,
        email: studentEmail,
        room: room,
        questionId: 0,
        correct: 1,
        tag: "",
        type: "",
        objective: "",
        responseTime: 0,
        attempt: totalAttempts,
        streak: streak,
        elapsedTime: startTime ? (Date.now() - startTime) : 0,
        adaptiveMode: "timed_complete",
        totalTime: timedModeDurationMs,
        accuracy: accuracy / 100,
        maxStreak: maxStreak,
        totalAttempts: totalAttempts
    });

    document.getElementById("bossMessage").innerText = "";
    document.getElementById("formulaHint").innerText = "";
    document.getElementById("artifactDrop").style.display = "none";
    document.getElementById("questionImageBox").style.display = "none";

    document.getElementById("question").innerHTML = `
        <span class="boss-title">TIME EXPIRED</span>
        <div class="boss-q">
            You reached as far as Room ${timedHighestRoom}.<br><br>
            Final Room: ${room}<br>
            Accuracy: ${accuracy}%<br>
            Total Attempts: ${totalAttempts}<br>
            Best Streak: ${maxStreak}<br>
            Setbacks Taken: ${timedSetbacks}
        </div>
    `;

    document.getElementById("answers").innerHTML = `
        <button class="continue-btn" onclick="restartTimedMode()">Retry Timed Trial</button>
        <button class="continue-btn" onclick="returnToModeSelectFromRun()">Choose Another Ledger Run</button>
    `;

    document.getElementById("message").innerText = "The trial ends. The Ledger records the result.";
}

function restartTimedMode(){
    gameMode = "timed";
    resetRunStateForNewMode();
    startSelectedMode("timed");
}

// unless you also update:
//   - boss rooms (10, 20, 30)
//   - progression logic elsewhere
//
// This affects UI only, not game logic.
// =============================================
function getAreaName(r) {
    if (r <= 9) return "The Chamber of Measures";
    if (r === 10) return "The Registrar’s Gate";
    if (r <= 19) return "The Labor Works";
    if (r === 20) return "The Warden’s Station";
    if (r <= 25) return "The Equilibrium Floor";
    if (r <= 29) return "The Adjustment Corridor";
    return "The Comptroller’s Tribunal";
}

// Returns a random prompt based on question type
// Falls back to "default" if type not found
function getWizardLine(type){
    const pool = wizardLines[type] || wizardLines.default;
    return pool[Math.floor(Math.random() * pool.length)];
}

    return pool[Math.floor(Math.random() * pool.length)];
}

{ id:9026, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"If CPI rises from 160 to 176 and nominal wages rise from $20 to $21, what happens to the real wage?", options:["It falls because prices rose 10% while nominal wages rose 5%","It rises because nominal wages rose","It stays unchanged because both CPI and wages rose","It doubles because CPI is above 100"], a:0, tag:"cpi_inflation", type:"multi-step", objective:"LO25.1", feedback:"Inflation is 10%; nominal wages rose 5%, so the real wage falls." },
{ id:9027, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"The CPI rises from 240 to 252. A student says inflation is 12 percentage points. What is the correct inflation rate?", options:["5%","12%","4.76%","252%"], a:0, tag:"cpi_inflation", type:"trap", objective:"LO25.1", feedback:"Inflation is the percentage change: (252 - 240)/240 = 5%, not 12 percentage points." },
{ id:9028, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"A new generic drug enters the market at a much lower price than the brand-name drug, and consumers switch rapidly. Why might the CPI overstate cost-of-living growth?", options:["The fixed basket may keep pricing the old mix and miss substitution toward the cheaper generic","The CPI always ignores medicine","The GDP deflator includes only generic drugs","Quality change always raises measured inflation"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"Substitution toward cheaper alternatives can make actual cost-of-living growth lower than a fixed basket suggests." },
{ id:9029, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"A laptop price rises 15%, but processing speed doubles and battery life improves. What is the measurement problem?", options:["Unmeasured quality improvement may cause the CPI to overstate inflation","Substitution bias is impossible because quality changed","The GDP deflator must fall","The laptop must be excluded from all price indexes"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"Some price increases reflect better quality, not only higher prices for the same good." },
{ id:9030, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"A streaming service did not exist in the base year and later gives consumers a cheaper alternative to cable. Which CPI problems are most directly involved?", options:["Introduction of new goods and substitution bias","Only GDP deflator bias","Only cyclical unemployment","Only nominal interest error"], a:0, tag:"cpi_bias", type:"multi-step", objective:"LO25.2", feedback:"New goods improve choice, and substitution toward them can reduce actual cost-of-living increases." },
{ id:9031, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"If CPI inflation is 7% but the fixed basket misses major quality gains and substitution toward cheaper goods, the CPI most likely:", options:["Overstates the rise in the cost of living","Understates the rise in the cost of living by definition","Perfectly measures welfare","Measures only domestic production"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"Substitution and quality improvements usually make CPI overstate true cost-of-living increases." },
{ id:9032, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Imported oil prices rise 30%, while domestically produced capital goods prices fall 10%. Which statement is best?", options:["CPI may rise while the GDP deflator may not rise as much because imported oil is excluded from domestic production","GDP deflator must rise more because oil is imported","CPI ignores oil because it is energy","Both indexes must move identically"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"CPI includes imported consumer goods; GDP deflator reflects domestic production prices." },
{ id:9033, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"A domestically produced business machine becomes more expensive, but imported consumer clothing becomes cheaper. Which index is more directly affected by the machine price?", options:["GDP deflator","CPI","Unemployment rate","Labor force participation rate"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"Domestically produced capital goods are part of GDP and affect the GDP deflator." },
{ id:9034, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Why can the CPI overstate inflation while the GDP deflator still moves differently for valid reasons?", options:["The CPI has fixed-basket issues, while the GDP deflator covers current domestic production rather than a fixed consumer basket","Both measure the exact same goods but use different names","The GDP deflator measures unemployment","The CPI measures only exports"], a:0, tag:"cpi_vs_deflator", type:"integration", objective:"LO25.3", feedback:"These indexes differ both because of CPI bias issues and because they cover different baskets." },
{ id:9035, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A salary was $55,000 when CPI was 125. The CPI is now 200. What current salary has the same purchasing power?", options:["$88,000","$68,750","$34,375","$110,000"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"Today's dollars = 55,000 x 200/125 = 88,000." },
{ id:9036, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A house cost $90,000 when CPI was 75. In today's dollars, it equals $360,000. What is today's CPI?", options:["300","225","400","120"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"360,000 = 90,000 x current CPI/75, so current CPI = 300." },
{ id:9037, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A current income of $84,000 equals $60,000 in year-T dollars. If CPI today is 210, what was CPI in year T?", options:["150","140","160","294"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"60,000 = 84,000 x CPI_T/210, so CPI_T = 150." },
{ id:9038, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"A borrower signs a fixed-rate loan at 8% when expected inflation is 3%. Actual inflation is 10%. What happened to the lender's real return?", options:["It fell from expected 5% to actual -2%","It rose from expected 5% to actual 18%","It stayed at 8%","It became exactly 10%"], a:0, tag:"interest_inflation", type:"multi-step", objective:"LO25.5", feedback:"Expected real return = 8 - 3 = 5. Actual real return = 8 - 10 = -2." },
{ id:9039, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"A saver earns 6% nominal interest. CPI inflation is 9%. Which is true?", options:["The account balance rises in dollars, but purchasing power falls by about 3%","The saver gains 15% purchasing power","The real interest rate is 6% because that is what the bank reports","Inflation is irrelevant if nominal interest is positive"], a:0, tag:"interest_inflation", type:"interpretation", objective:"LO25.5", feedback:"Real interest is approximately 6 - 9 = -3%, so purchasing power falls." },
{ id:9040, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"If a lender wants a 4% real return and expects 6% inflation, what nominal rate should be charged, approximately?", options:["10%","2%","6%","24%"], a:0, tag:"interest_inflation", type:"calculation", objective:"LO25.5", feedback:"Nominal rate ≈ real rate + expected inflation = 4 + 6 = 10%." },
{ id:9041, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"Nominal interest is 12%, actual inflation is 8%, and expected inflation was 5%. What are actual and expected real interest rates?", options:["Actual 4%; expected 7%","Actual 7%; expected 4%","Actual 20%; expected 17%","Actual -4%; expected -7%"], a:0, tag:"interest_inflation", type:"calculation", objective:"LO25.5", feedback:"Actual real = 12 - 8 = 4. Expected real = 12 - 5 = 7." },
{ id:9042, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"Which statement correctly links CPI adjustment and real interest rates?", options:["Both adjust nominal dollar figures for changes in purchasing power","Both measure domestic production only","Both ignore inflation","Both are calculated from exports minus imports"], a:0, tag:"interest_inflation", type:"integration", objective:"LO25.5", feedback:"Inflation adjustment and real interest rates both focus on purchasing power rather than raw dollars." },
{ id:9043, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"A basket cost $1,200 in the base year. CPI is now 150. Last year CPI was 125. What is the basket cost now and the inflation rate since last year?", options:["$1,800 and 20%","$1,500 and 25%","$1,800 and 25%","$1,500 and 20%"], a:0, tag:"cpi_inflation", type:"multi-step", objective:"LO25.1", feedback:"Current basket cost = 1,200 x 1.5 = 1,800. Inflation = (150 - 125)/125 = 20%." },
{ id:9044, difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"A country imports most consumer goods but produces mostly capital equipment. Imported consumer prices rise while domestic capital prices fall. Which statement is most accurate?", options:["CPI and GDP deflator can move in opposite directions","CPI and GDP deflator must move together","GDP deflator must include imported consumer goods","CPI must include capital equipment bought by firms"], a:0, tag:"cpi_vs_deflator", type:"integration", objective:"LO25.3", feedback:"Different baskets mean the CPI and GDP deflator can diverge sharply." },

{ id:9045, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"rule_of_70", secondarySkills:["real_gdp_per_person"], repairSkill:"rule_of_70", commonError:"Forgetting that doubling time is approximately 70 divided by the growth rate.", q:"Country A starts at $40,000 real GDP per person and grows at 2%. Country B starts at $20,000 and grows at 6%. Using the Rule of 70, which is most accurate?", options:["B can reach A's current level in about 12 years, while A doubles in about 35 years","B cannot catch A because it starts poorer","A doubles in about 12 years and B doubles in about 35 years","Both double in about 20 years"], a:0, tag:"growth_differences", type:"multi-step", objective:"LO26.1", feedback:"B doubles in about 70/6 = 11.7 years. A doubles in about 35 years." },
{ id:9046, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"A country's real GDP rises 5%, population rises 3%, and average hours per worker rise 1%. Approximate growth in real GDP per person is:", options:["About 2%","About 8%","About 1%","About 5%"], a:0, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"Real GDP per person grows roughly GDP growth minus population growth: 5% - 3% = 2%." },
{ id:9047, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"Country X has real GDP of $900B and population of 30M. Country Y has real GDP of $1.6T and population of 80M. Which has higher real GDP per person?", options:["Country X with $30,000 versus Country Y with $20,000","Country Y because total real GDP is larger","They are equal","It cannot be determined without CPI"], a:0, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"X: 900B/30M = 30,000. Y: 1.6T/80M = 20,000." },
{ id:9048, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"A poor country grows quickly after gaining stable property rights, schools, and foreign investment. Which explanation is strongest?", options:["The country is combining catch-up potential with institutions that allow capital and productivity growth","Growth must be caused only by inflation","Poor countries grow automatically regardless of policy","Property rights reduce investment"], a:0, tag:"growth_differences", type:"integration", objective:"LO26.1", feedback:"Catch-up growth is more likely when institutions support investment, human capital, and technology adoption." },
{ id:9049, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"A country has high total GDP but low GDP per person. What is the likely explanation?", options:["It has a large population relative to output","It must have low inflation","It must have high productivity","It has no labor force"], a:0, tag:"growth_differences", type:"interpretation", objective:"LO26.1", feedback:"Total GDP can be high while GDP per person is low if population is very large." },
{ id:9050, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Output rises from 80,000 units to 100,000 units while labor rises from 4,000 hours to 5,500 hours. What happens to productivity?", options:["It falls from 20 to about 18.18 units per hour","It rises from 20 to 25 units per hour","It stays at 20 units per hour","It rises from 18.18 to 20 units per hour"], a:0, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"Initial productivity = 80,000/4,000 = 20. New productivity = 100,000/5,500 ≈ 18.18." },
{ id:9051, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A country raises output per worker from $60,000 to $75,000 while population is unchanged. What is the productivity growth rate?", options:["25%","15%","20%","75%"], a:0, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"Growth = (75,000 - 60,000)/60,000 = 25%." },
{ id:9052, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Two countries have equal real GDP per person, but one works far fewer hours per person. What can be inferred?", options:["The country with fewer hours likely has higher output per hour","They must have identical productivity per hour","The country with more hours must be richer","Real GDP per person cannot be compared"], a:0, tag:"productivity", type:"interpretation", objective:"LO26.2", feedback:"Equal output per person with fewer hours implies greater output per hour." },
{ id:9053, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A country adds workers and total output rises, but output per worker falls. What is the best interpretation?", options:["Total GDP rose, but productivity declined, so living-standard gains are weaker","Productivity must rise because output rose","Real GDP per person must rise faster than GDP","The Rule of 70 no longer applies"], a:0, tag:"productivity", type:"interpretation", objective:"LO26.2", feedback:"Total output and productivity can move in different directions." },
{ id:9054, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A factory adds machines but does not train workers to use them well. Output rises only slightly. Which concept best explains the weak result?", options:["Physical capital and human capital are complements; capital alone may have limited effect","Natural resources always dominate machines","GDP excludes machines","Human capital reduces productivity"], a:0, tag:"productivity_factors", type:"integration", objective:"LO26.3", feedback:"Capital is more productive when workers have the skills to use it effectively." },
{ id:9055, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A country discovers oil but has weak courts, low education, and poor infrastructure. Why might productivity remain low?", options:["Natural resources do not guarantee high productivity without institutions, human capital, and physical capital","Oil is not a natural resource","Education matters only in service economies","Infrastructure lowers capital per worker"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"Natural resources can help, but productivity depends on several complementary factors." },
{ id:9056, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A new production method doubles output using the same workers and machines. Which productivity factor changed most directly?", options:["Technological knowledge","Physical capital per worker","Natural resources per worker","Labor force participation"], a:0, tag:"productivity_factors", type:"trap", objective:"LO26.3", feedback:"A better method of production is technological knowledge, not necessarily more physical capital." },
{ id:9057, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A country builds ports, roads, and power grids while also expanding vocational education. Which factors are increased?", options:["Physical capital and human capital","Only natural resources","Only technological knowledge","Only population growth"], a:0, tag:"productivity_factors", type:"multi-step", objective:"LO26.3", feedback:"Infrastructure is physical capital; vocational education builds human capital." },
{ id:9058, difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"If capital per worker rises from $50,000 to $100,000 and output per worker rises from $70,000 to $90,000, what does this suggest?", options:["Capital increased productivity, but less than proportionally, consistent with diminishing returns","Capital had no effect","Output per worker doubled","Diminishing returns means output must fall"], a:0, tag:"diminishing_returns", type:"interpretation", objective:"LO26.3", feedback:"Capital doubled, but output per worker rose by less than double, consistent with diminishing returns." },
